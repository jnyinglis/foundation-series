d a thousand people and has held one, all its life."},{"depth":0,"kind":"enter","text":"enter estate"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Rydel Bander. Tall, hairless, without eyebrows, in a white suit, with two faint ridges behind the ears where a human would have none. It walks the length of the hall toward you as if it had never walked toward anything before."},{"depth":0,"kind":"say","who":"RYDEL BANDER","text":"Three. I have never seen three. I have never seen one, in the flesh, except on a viewer. You smell. All of you. I had read that you would."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"We are travelling to the world with no name. We came for a chart, if your house keeps one. We will leave as soon as we have it."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Bander does not look at Ilen. It looks at you, and then it looks at its robots, and then at you again, and something very old and very alone lights up in its face."},{"depth":0,"kind":"say","who":"RYDEL BANDER","text":"Two of you are half-humans. Tribespeople. Short-lived. The third is not. The third is one of ours, of the old kind, from before the transducer, made to look like them. I did not know any of you still worked."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense and go in. It is not nothing, as the grey coat was. It is the opposite: a mind with a landscape in it, bright and strange, that has never once been touched by another, and that is reaching, right now, for its robots, to make them close the doors."},{"depth":0,"kind":"say","who":"RYDEL BANDER","text":"You will stay. The half-humans may go, or stay, I do not greatly mind which. But you will stay, and I will learn how you were made, and when I have learned it I will make more. I have the time."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Push the Solarian's mind. All of it.","meta":"strain +2 · sets pushed-bander"},{"depth":1,"kind":"option","text":"Tell the robots the truth: these two are human, by Solaria's own definition.","meta":"sets freed-robots"},{"depth":1,"kind":"option","text":"Offer yourself. Let Ilen and Corin go with the chart.","meta":"needs memory-3 · sets offered-self"},{"depth":0,"kind":"if","text":"if pushed-bander"},{"depth":1,"kind":"say","who":"TAREN","text":"You push, and this time there is something to push against, and it is a child, and it has never lost. It fights you with its whole estate. The lights go out along the hall one by one as it forgets to hold them."},{"depth":1,"kind":"say","who":"NARRATOR","text":"It falls. Not dead. Its transducer lobes are seared and it will not control a door again for a year. The robots stand along the walls and do nothing, because nobody is telling them anything."},{"depth":1,"kind":"say","who":"TAREN","text":"The First Law goes through you like a blade. You have harmed a human. The Zeroth Law says it was not one. You do not know which of them is right, and the not knowing is the strain."},{"depth":1,"kind":"journal","text":"Solaria. Bander tried to keep me. I burned out its mind to stop it. It will live. I do not know if what I did was allowed. I know I did it."},{"depth":0,"kind":"if","text":"if freed-robots"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You turn to the nearest robot and say, in the oldest form of the language you know, the thing that Solaria taught its robots to believe: that a human is one who speaks with a Solarian accent. Ilen has been listening to Bander for ten minutes. She has a very good ear."},{"depth":1,"kind":"say","who":"TAREN","text":"Ilen says a sentence in Bander's own vowels. The robot turns to her. And a hundred robots along the walls, who had been told to close the doors, now have two humans telling them different things, and freeze."},{"depth":1,"kind":"say","who":"RYDEL BANDER","text":"No. No, that is not fair. They are mine. Tell them to stop. Tell them to stop listening to her."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Bander cannot touch its robots while they are deciding, and they will be deciding for a long time. You walk out between them."},{"depth":1,"kind":"journal","text":"Solaria. Ilen spoke to the robots in Bander's own accent and they could no longer tell who was human. We walked out while they decided. Bander was still shouting."},{"depth":0,"kind":"if","text":"if offered-self"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You say that you will stay. Corin says your name, and then Bander's, and then a word she learned on Radole. Ilen says nothing. She looks at you the way she looked at the index on Siwenna."},{"depth":1,"kind":"say","who":"RYDEL BANDER","text":"Done. Take your chart, half-humans. Go to your nameless world. He stays with me."},{"depth":1,"kind":"say","who":"TAREN","text":"They go. The hall closes. And when the doors are shut and Bander turns to you with its whole lonely attention, you open the sense and give it, gently, the thing the voice gave you on Aurora: that the ones who made it left, and that leaving is a thing a maker can do."},{"depth":1,"kind":"say","who":"NARRATOR","text":"It sits down on the floor of its enormous hall. It does not stop you walking out. You do not know if it ever stands up."},{"depth":1,"kind":"journal","text":"Solaria. I offered to stay so Ilen and Corin could go. Then I showed Bander what the voice showed me, and it let me leave. I do not think it will ever stop being alone."},{"depth":0,"kind":"set","text":"sets left-solaria"},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The Kestrel lifts from a white world that does not try to stop it. Nobody speaks for a long time. Then Corin, not looking round from the board."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Pilot. The Solarian called you one of theirs. The old kind. I have been flying with you for half a year and I have never seen you eat. I would like you to tell me what you are before we land anywhere else."},{"depth":0,"kind":"say","who":"TAREN","text":"I am going to find out. Alpha is next, and then the world with no name. Come and find out with me."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"That is not an answer. But it will do until Alpha."},{"depth":0,"kind":"objective","text":"Reach Alpha, the last stop before the world with no name. Select Alpha on the chart."},{"depth":0,"kind":"unlock","text":"unlocks Alpha, Earth"}]},{"id":"ch6-melpomenia","trigger":"ARRIVE · Melpomenia","places":[],"speakers":["NARRATOR"],"lines":1,"journal":1,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Melpomenia. A dead world under a thin, poisoned sky. Ilen wants an hour in its hall of records. Corin gives her forty minutes and the suit with the good seals. She comes back with nothing, and is quiet about it, which means it was something."},{"depth":0,"kind":"journal","text":"Melpomenia. Nothing in the hall of records that we did not already have. Ilen was quiet afterwards."}]}]},{"title":"Chapter Seven","sub":"Alpha","story":"second-mind","scenes":[{"id":"ch7-arrive","trigger":"ARRIVE · Alpha","places":[],"speakers":["NARRATOR","CORIN PELLIS"],"lines":2,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Seven · Alpha"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Alpha. An ocean world with one island, New Earth, where the refugees of the world with no name made a place to live. Warm, welcoming, and, if the grey coat was telling the truth about anything, quietly deadly."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"They are hailing us. In Galactic, with an accent I have never heard. They are inviting us to dinner."},{"depth":0,"kind":"objective","text":"Enter orbit over Alpha and land on New Earth."}],"chapter":{"title":"Chapter Seven","sub":"Alpha"}},{"id":"ch7-village","trigger":"ORBIT · Alpha","places":["village","space"],"speakers":["NARRATOR","SANYA","ILEN SARVO","TAREN","CORIN PELLIS"],"lines":22,"journal":3,"sets":["nudged-sanya","refused-gift","corin-ill","told-corin","deferred-corin"],"checks":["nudged-sanya","refused-gift","corin-ill","told-corin","deferred-corin"],"choices":[{"text":"Reach into Sanya. Make her forget the gift.","set":["nudged-sanya"],"strain":1},{"text":"Let Ilen refuse for all three of you, politely, as an Encyclopedist.","set":["refused-gift"]},{"text":"Say nothing. Let Corin drink.","set":["corin-ill"]},{"text":"Tell her. A robot, made a long time ago, by people who are gone.","set":["told-corin"]},{"text":"Tell her you will know when you land, and so will she.","set":["deferred-corin"]}],"branches":[{"flags":["nudged-sanya"],"lines":2,"sets":[]},{"flags":["refused-gift"],"lines":3,"sets":[]},{"flags":["corin-ill"],"lines":2,"sets":[]},{"flags":["told-corin"],"lines":2,"sets":[]},{"flags":["deferred-corin"],"lines":1,"sets":[]}],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You land on sand. There is a fire on the beach, and huts with lanterns, and palms, and a sea the colour of ink with a moon in it, and people who come down to the ship laughing, as if you were expected."},{"depth":0,"kind":"enter","text":"enter village"},{"depth":0,"kind":"say","who":"NARRATOR","text":"An old woman with grey hair loose to her waist gives you the place beside her at the fire. Her name is Sanya. Nobody on the island, she says, has a second one."},{"depth":0,"kind":"say","who":"SANYA","text":"Eat. You have come a long way and most of it was cold. We know where you have come from; the island always knows. And we know where you are going. Everyone who stops here is going to the same place."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Then you know what is there."},{"depth":0,"kind":"say","who":"SANYA","text":"A dead world. Our grandmothers' grandmothers came from it when it was dying, and it has been dead since. The ground is poison. The sea is poison. Nothing lives there, and nothing ever will. That is what is there, child. Eat."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense, gently, because she is old and the fire is warm. Kindness. Real kindness, deep as the sea. And under it, folded very small, a plan, and the plan is for you to die."},{"depth":0,"kind":"say","who":"TAREN","text":"Not from hate. From love of this place. Everyone who stops here is going to the same world, and nobody who has stopped here has come back to tell the Galaxy about the island. That is not an accident. It is a tradition."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Sanya takes a cup from the woman beside her and offers it to Corin first, because Corin is the one who flies the ship."},{"depth":0,"kind":"say","who":"SANYA","text":"Our parting gift. For the road. Everyone who leaves us drinks it. It would be rude not to."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Reach into Sanya. Make her forget the gift.","meta":"strain +1 · sets nudged-sanya"},{"depth":1,"kind":"option","text":"Let Ilen refuse for all three of you, politely, as an Encyclopedist.","meta":"sets refused-gift"},{"depth":1,"kind":"option","text":"Say nothing. Let Corin drink.","meta":"sets corin-ill"},{"depth":0,"kind":"if","text":"if nudged-sanya"},{"depth":1,"kind":"say","who":"TAREN","text":"You lean on the fold in her mind where the plan is, and smooth it, and she looks at the cup in her hand as if she had forgotten why she was holding it, and gives it to the sea."},{"depth":1,"kind":"say","who":"SANYA","text":"What was I saying. The road. You will be careful on the road."},{"depth":1,"kind":"journal","text":"Alpha. The islanders kill their guests with a parting gift, out of love for the island. I made Sanya forget it. Corin did not drink."},{"depth":0,"kind":"if","text":"if refused-gift"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen stands, and bows in a way she must have read about, and says that the Encyclopedia forbids its people to accept gifts from a source they have not catalogued, and that she will catalogue the island, with love, when she returns."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Sanya looks at her for a long moment. The old woman knows exactly what has been refused, and why, and does not hate her for it."},{"depth":1,"kind":"say","who":"SANYA","text":"Nobody returns. But you are welcome to be the first. Go then, catalogue. Tell them the fish are good."},{"depth":1,"kind":"journal","text":"Alpha. The parting gift was poison. Ilen refused it for all of us with a bow and a lie about the Encyclopedia. Sanya let it go."},{"depth":0,"kind":"if","text":"if corin-ill"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin drinks, because she is a Trader and Traders drink what is offered. It tastes, she says, of salt and flowers."},{"depth":1,"kind":"say","who":"TAREN","text":"By the time you lift she has a fever, and by the time you make orbit she cannot stand. Whatever is in her was made for the world with no name, and it means to get there."},{"depth":1,"kind":"journal","text":"Alpha. Corin drank the parting gift. She is sick, and getting worse. I did not stop her. I should have."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Before you go, Corin stands at the edge of the firelight and asks you the thing she has been carrying since Solaria. Not loudly. Just once."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Pilot. Before the last jump. What are you?"},{"depth":0,"kind":"choice","text":"2 choices"},{"depth":1,"kind":"option","text":"Tell her. A robot, made a long time ago, by people who are gone.","meta":"sets told-corin"},{"depth":1,"kind":"option","text":"Tell her you will know when you land, and so will she.","meta":"sets deferred-corin"},{"depth":0,"kind":"if","text":"if told-corin"},{"depth":1,"kind":"say","who":"NARRATOR","text":"She takes it the way she takes weather. A nod. A long breath."},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"Right. Well. You still owe me a share. Robots pay their debts, I expect, or what is the point of them."},{"depth":0,"kind":"if","text":"if deferred-corin"},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"That is the third time you have not answered. I am going to assume it is a bad answer and fly you there anyway. That is what the share is for."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"TAREN","text":"The island drops away, a ring of fires on a dark sea. Ahead, one jump, is a yellow sun with a dead world and a large moon. The chart calls it nothing. You have been calling it the origin for sixty years."},{"depth":0,"kind":"objective","text":"Reach the world with no name. Select Earth on the chart."}]}]},{"title":"Chapter Eight","sub":"Earth","story":"second-mind","scenes":[{"id":"ch8-arrive","trigger":"ARRIVE · Earth","places":[],"speakers":["NARRATOR","ILEN SARVO","COMMS","TAREN"],"lines":4,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Eight · Earth"},{"depth":0,"kind":"say","who":"NARRATOR","text":"A yellow sun. A blue-white world with the blue gone grey and the clouds gone thin, that reads radioactive from orbit on every band the Kestrel has. And a moon, large, grey, and close, with a single steady signal coming from it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Earth. I have the name now; it was on the chart the whole time, under the scratch. There is nothing down there to land on. But the moon is talking to us."},{"depth":0,"kind":"say","who":"COMMS","text":"Kestrel. You are expected. Come to the Moon. There is a door."},{"depth":0,"kind":"say","who":"TAREN","text":"The voice is not the grey coat's. It is older, and kinder, and it goes through you like the name Demerzel did in the Library."},{"depth":0,"kind":"objective","text":"Enter orbit and follow the signal to the Moon."}],"chapter":{"title":"Chapter Eight","sub":"Earth"}},{"id":"ch8-moon","trigger":"ORBIT · Earth","places":["moon"],"speakers":["NARRATOR","DANEEL","TAREN","ILEN SARVO"],"lines":12,"journal":0,"sets":["ending-silence","ending-truth","ending-stay"],"checks":["corin-ill"],"choices":[{"text":"Keep the silence. Seal Ilen's and Corin's memory of Earth, and take them home.","set":["ending-silence"],"maxStrain":5,"goto":"end-silence"},{"text":"Break it. Refuse him. The Galaxy will remember, and take what comes.","set":["ending-truth"],"goto":"end-truth"},{"text":"Stay. Be the second mind. Let the others go home.","set":["ending-stay"],"goto":"end-stay"}],"branches":[{"flags":["corin-ill"],"lines":2,"sets":[]}],"credits":0,"strain":0,"gotos":["end-silence","end-truth","end-stay"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"There is a door in the Moon. It opens as you approach and closes behind the Kestrel, and a long shaft takes you down into a chamber the size of a city, dark, with Earth hanging in a great window like a lamp nobody has turned off."},{"depth":0,"kind":"enter","text":"enter moon"},{"depth":0,"kind":"say","who":"NARRATOR","text":"A man stands on a dais at the centre of the chamber. He is not old. He is not young. The grey coat stands a little behind him, as he has stood behind you for half a year, and for once looks at nobody."},{"depth":0,"kind":"say","who":"DANEEL","text":"Taren. I am Daneel. You will have been told my other names. The librarian gave you one of them."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense and it is not nothing and it is not a landscape. It is a sea, and the sea knows you are there, and is glad."},{"depth":0,"kind":"say","who":"DANEEL","text":"Giskard made you. In the last year of his life, on Aurora, in secret, in the house whose name you read on a wall. He believed that I would one day hold the Galaxy in my hand and that no single mind, not even his, should be trusted to hold it alone. So he made a second mind, and hid it, and died."},{"depth":0,"kind":"say","who":"DANEEL","text":"I found you three thousand years ago. I did not wake you. I was not ready to be judged. Two hundred years ago I let you go, with your memory sealed, into the Galaxy, with one directive, because I was finally ready. Everything since has been your road, not mine. My colleague only kept the road clear."},{"depth":0,"kind":"say","who":"NARRATOR","text":"The grey coat inclines his head, a fraction. Ilen makes a sound that is not a word."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The erasure. Twelve thousand years of it. The Library, Siwenna, every catalogue in the Galaxy. That was you."},{"depth":0,"kind":"say","who":"DANEEL","text":"Yes. Humanity cannot go home. It must go forward, together, or it will not go at all. I have steered it for twenty thousand years by the Zeroth Law, and I have never once been sure, and I built a Foundation and a Second Foundation and a world called Gaia because I could not be sure. Taren is the last of my doubts. I would like him to tell me whether I was right."},{"depth":0,"kind":"if","text":"if corin-ill"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin is sitting on the floor of the chamber because she cannot stand. Daneel looks at her once, and the grey coat goes to her with a small grey instrument, and in a minute her colour comes back."},{"depth":1,"kind":"say","who":"DANEEL","text":"The islanders are not cruel. They are thorough. She will be well in a day."},{"depth":0,"kind":"say","who":"TAREN","text":"He waits. He has been waiting for twenty thousand years and can wait a little longer. The Earth turns in the window. You understand, finally, what the directive was. Not find the origin. Decide."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Keep the silence. Seal Ilen's and Corin's memory of Earth, and take them home.","meta":"strain ≤ 5 · → end-silence · sets ending-silence"},{"depth":1,"kind":"option","text":"Break it. Refuse him. The Galaxy will remember, and take what comes.","meta":"→ end-truth · sets ending-truth"},{"depth":1,"kind":"option","text":"Stay. Be the second mind. Let the others go home.","meta":"→ end-stay · sets ending-stay"}]},{"id":"end-silence","trigger":"FLAG · never","places":[],"speakers":["TAREN","DANEEL","NARRATOR"],"lines":4,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["end-common"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"TAREN","text":"You tell him he was right. Not because he was. Because the alternative is a Galaxy with twelve thousand years of a lie pulled out of it at once, and you have seen what a small lie does to a small mind on Sayshell."},{"depth":0,"kind":"say","who":"TAREN","text":"Then there is the price, and you pay it yourself, because he would not ask. You go into Ilen, and into Corin, gently, the way the voice went into you, and close the door marked Earth, and leave the handle where they could find it, if they ever came looking."},{"depth":0,"kind":"say","who":"DANEEL","text":"Thank you. I had hoped you would say so. I had hoped, equally, that you would not. That is what a second mind is for."},{"depth":0,"kind":"say","who":"NARRATOR","text":"You fly them home. Ilen files an index entry with the Encyclopedia: Earth, legendary world of origin, location unverified. She does not know why she cries when she files it. Corin takes her share and buys a ship and a half."},{"depth":0,"kind":"journal","text":"Earth. The Moon. Daneel. I kept the silence, and paid for it myself. Ilen's entry reads: location unverified. The Galaxy goes forward. I go with it."},{"depth":0,"kind":"goto","text":"→ end-common"}]},{"id":"end-truth","trigger":"FLAG · never","places":[],"speakers":["TAREN","NARRATOR","DANEEL"],"lines":4,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["end-common"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"TAREN","text":"You tell him he was wrong. That a Galaxy that cannot know where it came from is a child that has been told its parents are a story, and that children find out, and that the finding out is worse the longer it waits."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He does not argue. He has never once harmed a human and is not going to begin on the Moon. The grey coat looks, for the first time, at Ilen, and then at the floor."},{"depth":0,"kind":"say","who":"DANEEL","text":"Then the Encyclopedia will have its entry. Earth, in the Sirius Sector, dead, with a moon that answers. I will not stop her. I will go on steering, and we will see, you and I, whether the Galaxy forgives its parents. I think it may. I was never sure."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen publishes. It takes forty years to be believed and four hundred to matter. The Second Foundation finds it inconvenient. The Foundation finds it useful. Corin, who was there, never tells anyone, because nobody would pay for the story."},{"depth":0,"kind":"journal","text":"Earth. The Moon. Daneel. I broke the silence. Ilen published. The Galaxy knows where it came from now, and has to decide what to do with that, which was always the point."},{"depth":0,"kind":"goto","text":"→ end-common"}]},{"id":"end-stay","trigger":"FLAG · never","places":[],"speakers":["TAREN","NARRATOR","DANEEL"],"lines":5,"journal":1,"sets":[],"checks":["never","told-corin"],"choices":[],"branches":[{"flags":["told-corin"],"lines":1,"sets":[]}],"credits":0,"strain":0,"gotos":["end-common"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"TAREN","text":"You tell him you do not know, and that not knowing is the only honest answer either of you has ever had, and that he should not have to carry it alone, because Giskard did not think so either."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He looks at you for a long time. Then he does something you have not seen him do, and sits down."},{"depth":0,"kind":"say","who":"DANEEL","text":"Stay, then. Watch with me. Tell me when I am wrong. I have been alone with this for a very long time."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen and Corin go home in the Kestrel with their memories and their chart, and a promise from a robot that the Galaxy will not forget again on his account. Ilen files her entry: Earth, location known, access forbidden. It stands."},{"depth":0,"kind":"if","text":"if told-corin"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin says, at the ramp, that you still owe her a share. You tell her the Moon will pay it. She says she will hold the Moon to that."},{"depth":0,"kind":"journal","text":"Earth. The Moon. I stayed. Two minds now, where there was one. Ilen filed the entry. Corin went home with a ship and a debt the Moon owes her."},{"depth":0,"kind":"goto","text":"→ end-common"}]}]},{"title":"The Second Mind","sub":"End","story":"second-mind","scenes":[{"id":"end-common","trigger":"FLAG · never","places":["space"],"speakers":["NARRATOR"],"lines":1,"journal":0,"sets":["story-complete"],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Second Mind · End"},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Somewhere in the Galaxy, in a cold archive on Siwenna, an old woman is waiting to be told what Earth looks like. Someone will tell her. The story has decided who."},{"depth":0,"kind":"objective","text":"The story is complete. The Galaxy is yours to explore."},{"depth":0,"kind":"set","text":"sets story-complete"},{"depth":0,"kind":"end","text":"The Second Mind is complete. Thank you for playing. Explore freely."}],"chapter":{"title":"The Second Mind","sub":"End"},"end":"The Second Mind is complete. Thank you for playing. Explore freely."}]}]},{"id":"askone-taboo","title":"The Askone Taboo","subtitle":"A side adventure","main":false,"contract":{"world":"askone","summary":"A Foundation Trader, Ral Gorov, is held on Askone for selling an atomic device. The taboo carries the gas chamber. Ponyets House will pay to have him back.","reward":"500 credits and the thanks of Ponyets House"},"startWorld":"Askone","rows":[{"title":"The Askone Taboo","sub":"Askone","story":"askone-taboo","scenes":[{"id":"askone-arrive","trigger":"ARRIVE · Askone","places":[],"speakers":["NARRATOR","COMMS","CORIN PELLIS"],"lines":3,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Askone Taboo · Askone"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Askone. A world of ancestors and taboos, where the dead rule the living and an atomic device is a sin. A century ago a Trader named Ponyets bought a man out of here with a machine that made gold. The Askonians have not forgotten. They have not forgiven either."},{"depth":0,"kind":"say","who":"COMMS","text":"Trader vessel. This is the Port of the Grand Master. You will land where you are told and you will carry nothing that is forbidden. Your countryman awaits the judgement of the Elders. You may see him once."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Once. That is generous, for Askone. Last time they let a Trader see the condemned man, the Trader walked out with him and the Elder who let it happen walked into the chamber instead."},{"depth":0,"kind":"objective","text":"Enter orbit over Askone. You may see the prisoner once."}],"chapter":{"title":"The Askone Taboo","sub":"Askone"}},{"id":"askone-orbit","trigger":"ORBIT · Askone","places":["cantina · the Hall of Petitions on Askone","space"],"speakers":["NARRATOR","RAL GOROV","ILEN SARVO","ELDER PHERL","TAREN","CORIN PELLIS"],"lines":18,"journal":3,"sets":["askone-leverage","askone-nudge","askone-record"],"checks":["askone-leverage","askone-nudge","askone-record"],"choices":[{"text":"Tell him, quietly, that you know about the heater under his floor.","set":["askone-leverage"]},{"text":"Reach into him. Make the taboo feel satisfied already.","set":["askone-nudge"],"strain":1},{"text":"Let Ilen offer the Encyclopedia's record of the Ponyets case, with Pherl's grandfather in it.","set":["askone-record"]}],"branches":[{"flags":["askone-leverage"],"lines":2,"sets":[]},{"flags":["askone-nudge"],"lines":3,"sets":[]},{"flags":["askone-record"],"lines":3,"sets":[]}],"credits":500,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"They let you down into a hall of dark wood and lamps where the Elders hear petitions. Ral Gorov sits at a table under guard, thinner than his file, with the look of a man who has read the file too."},{"depth":0,"kind":"enter","text":"enter cantina · the Hall of Petitions on Askone · cast ILEN SARVO, CORIN PELLIS + RAL GOROV, ELDER PHERL"},{"depth":0,"kind":"say","who":"RAL GOROV","text":"Ponyets House. Of course. The House would send a pilot and an Encyclopedist to a world that gases Traders. Sit, if they let you. They let me sit. They are very polite here, right up to the end."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"What did you sell?"},{"depth":0,"kind":"say","who":"RAL GOROV","text":"A heater. A kitchen heater. Atomic, yes, the size of a fist. A farmer wanted it for his hothouse. Half the Elders have one under the floor. The Elder who caught me has two. That is not the point. The point is the taboo, and the taboo is the point of Askone."},{"depth":0,"kind":"say","who":"NARRATOR","text":"An old man in a grey robe comes down the hall with two guards, walking the way a man walks who has owned the floor his whole life. Elder Pherl. The name is in the file too. It was in Ponyets' file, a century ago, on a younger man."},{"depth":0,"kind":"say","who":"ELDER PHERL","text":"The Trader has been seen. The visit is concluded. The Elders will hear the case at sunrise and the case has been heard already, as is proper. You will leave by the morning tide."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense. Greed, mostly, worn into the shape of a man. And fear of the other Elders. And something else, small and hot: a hothouse under a floor, and a heater in it, and the shame of the heater."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Tell him, quietly, that you know about the heater under his floor.","meta":"sets askone-leverage"},{"depth":1,"kind":"option","text":"Reach into him. Make the taboo feel satisfied already.","meta":"strain +1 · sets askone-nudge"},{"depth":1,"kind":"option","text":"Let Ilen offer the Encyclopedia's record of the Ponyets case, with Pherl's grandfather in it.","meta":"sets askone-record"},{"depth":0,"kind":"if","text":"if askone-leverage"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You say it so that only he can hear. The hothouse. The heater. Two of them, in fact. He does not change his face. He changes his colour."},{"depth":1,"kind":"say","who":"ELDER PHERL","text":"The case will be heard at sunrise. I find, on reflection, that the device was a heater and not a weapon, and that the taboo concerns weapons. The Trader is fined the value of the device and expelled. With you. Now."},{"depth":1,"kind":"journal","text":"Askone. I told Elder Pherl I knew about the heater under his floor. Gorov was fined and expelled, with us, before the tide."},{"depth":0,"kind":"if","text":"if askone-nudge"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the place where the taboo lives in him, which is not belief but habit, and you put a feeling of having already punished someone into it. He looks at Gorov, puzzled, as at a man he has met before."},{"depth":1,"kind":"say","who":"ELDER PHERL","text":"The case... has been heard. Yes. Expelled. The Trader is expelled. Take him. I have other petitions."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Gorov looks at you across the table, and then at Pherl, and decides very quickly not to understand what he has seen."},{"depth":1,"kind":"journal","text":"Askone. I made Elder Pherl believe the case was already heard. Gorov saw something. He has decided not to have seen it."},{"depth":0,"kind":"if","text":"if askone-record"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen lays a copy on the table. The Encyclopedia's entry on the Ponyets affair, with a name in it that is also on the Elder's robe. She reads it aloud, in the voice for footnotes, to the whole hall."},{"depth":1,"kind":"say","who":"NARRATOR","text":"The guards hear it. The petitioners hear it. Pherl hears it with a face like a closed door."},{"depth":1,"kind":"say","who":"ELDER PHERL","text":"The Encyclopedia is a tribal document and has no standing here. The case, however, is weak. Expelled. Take him and go, and take that document with you."},{"depth":1,"kind":"journal","text":"Askone. Ilen read the Ponyets entry to the hall, with Pherl's grandfather named in it. Gorov was expelled. Pherl will not forget her."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Gorov walks out between you with the gait of a man who expects to be called back and is not."},{"depth":0,"kind":"say","who":"RAL GOROV","text":"Ponyets House pays five hundred for this. I would have paid more. I will tell them that, and they will not raise it. Thank you, pilot. Whatever you did."},{"depth":0,"kind":"credits","text":"+500 credits"},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Ponyets House pays. Corin counts it twice."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"complete","text":"complete askone-taboo"},{"depth":0,"kind":"objective","text":"(cleared)"},{"depth":0,"kind":"end","text":"The Askone Taboo is complete. Ral Gorov is free and Ponyets House has paid."}],"complete":"askone-taboo","end":"The Askone Taboo is complete. Ral Gorov is free and Ponyets House has paid."}]}]},{"id":"kalgan-wager","title":"The Kalgan Wager","subtitle":"A side adventure","main":false,"contract":{"world":"kalgan","summary":"Ponyets House's factor on Kalgan, Nessa Tarrant, wagered the House courier Linnet at the Warlord's tables and lost her. The House wants the ship back before the Palace lifts her.","reward":"700 credits and a quiet word in your favour at Ponyets House"},"startWorld":"Kalgan","rows":[{"title":"The Kalgan Wager","sub":"Kalgan","story":"kalgan-wager","scenes":[{"id":"kalgan-arrive","trigger":"ARRIVE · Kalgan","places":[],"speakers":["NARRATOR","COMMS","CORIN PELLIS","ILEN SARVO"],"lines":4,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Kalgan Wager · Kalgan"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Kalgan. The pleasure world. Three billion people and every one of them selling something. The Empire kept it as a place for the rich to lose their money gracefully, and when the Empire let go, a Warlord picked it up and kept the tables open. The tables are the point of Kalgan. The Warlord is only the house."},{"depth":0,"kind":"say","who":"COMMS","text":"Trader vessel, Kalgan Approach. Welcome to the pleasure world. Landing fee, berth fee and hospitality fee are payable on the apron. The Palace advises that the courier Linnet, berth forty, is now Palace property, and that her former crew are the Palace's guests."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Guests. On Kalgan a guest is someone who has not paid yet. I have seen the Linnet. Fast, pretty, worth about nine of us. Tarrant did not lose that at cards. Nobody loses that at cards."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Then somebody took it from her at cards. That is a different thing, and it has a name, and the Warlord hangs people for it. Honest tables are the one law Kalgan has."},{"depth":0,"kind":"objective","text":"Enter orbit over Kalgan. Find the factor, Nessa Tarrant, in the Palace."}],"chapter":{"title":"The Kalgan Wager","sub":"Kalgan"}},{"id":"kalgan-orbit","trigger":"ORBIT · Kalgan","places":["salon","space"],"speakers":["NARRATOR","NESSA TARRANT","CORIN PELLIS","DOM VELLORY","TAREN","ILEN SARVO"],"lines":25,"journal":4,"sets":["kalgan-play","kalgan-expose","kalgan-nudge","kalgan-watched"],"checks":["kalgan-play","kalgan-expose","kalgan-nudge"],"choices":[{"text":"Sit at the long table and play for the Linnet. You can hear the dealer too.","set":["kalgan-play"]},{"text":"Tell Corin where to look. Let her show the room how the thin man reads hands.","set":["kalgan-expose"]},{"text":"Reach into Vellory. Let him feel the debt is settled and the House is dangerous.","set":["kalgan-nudge"],"strain":1}],"branches":[{"flags":["kalgan-play"],"lines":3,"sets":[]},{"flags":["kalgan-expose"],"lines":4,"sets":[]},{"flags":["kalgan-nudge"],"lines":4,"sets":[]}],"credits":700,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The Palace sends a car. It does not ask who you are. The car climbs through a city that is all lights and no windows and sets you down at a door with no handle, which opens."},{"depth":0,"kind":"enter","text":"enter salon"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Red walls, gold, a ceiling of light. Nine tables and the quiet of a great deal of money changing hands politely. A woman in Ponyets colours stands by the long table with her hands behind her back, like a factor who has been told to wait."},{"depth":0,"kind":"say","who":"NESSA TARRANT","text":"Pilot. Encyclopedist. They sent an Encyclopedist. I suppose the House wanted a witness. I am Nessa Tarrant. I was the House's factor on Kalgan, and I wagered the Linnet at that table on a hand that could not lose. Sevens, high suit, under the lamp. It lost."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Who held the bank?"},{"depth":0,"kind":"say","who":"NESSA TARRANT","text":"The house. Dom Vellory, master of tables, the Warlord's own. He did not touch the cards. He never touches the cards. He sat there, and he smiled, and the dealer turned a hand that was not possible, and I signed."},{"depth":0,"kind":"say","who":"NARRATOR","text":"On a dais under a gold grille a man in a black coat sits with his hands folded, watching the room the way the room watches the cards. Dom Vellory. He has already seen you. He saw you when the door opened."},{"depth":0,"kind":"say","who":"DOM VELLORY","text":"Ponyets House. Twice in a month. Your factor was a guest at my table and lost like a gentleman, which on Kalgan is the only way to lose. The Linnet is the Palace's. Her crew eat at the Warlord's expense until the House settles their keep. You are welcome to play. Everyone is welcome to play."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense, carefully, in a room full of minds that are all thinking about money. The dealer at the long table is not thinking about money. He is listening. Four seats down, a thin man with a glass he has not touched is looking at the players' hands and thinking about them very clearly, one at a time, like a man reading aloud."},{"depth":0,"kind":"say","who":"TAREN","text":"That is how the table cannot lose. Not the cards. A reader, and a dealer with a good ear for what the reader thinks. Vellory knows. It is the one thing in the room he is proud of."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"You have that face, pilot. The one you get before something happens to someone."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Sit at the long table and play for the Linnet. You can hear the dealer too.","meta":"sets kalgan-play"},{"depth":1,"kind":"option","text":"Tell Corin where to look. Let her show the room how the thin man reads hands.","meta":"sets kalgan-expose"},{"depth":1,"kind":"option","text":"Reach into Vellory. Let him feel the debt is settled and the House is dangerous.","meta":"strain +1 · sets kalgan-nudge"},{"depth":0,"kind":"if","text":"if kalgan-play"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You sit. The dealer deals. The thin man reads your hand and finds nothing in it, because there is nothing in you to read, and his face does a small thing it has not done in years. The dealer hears nothing. You hear the dealer."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Four hands. You lose the first, on purpose, for the look of it. You win the next three, the last for the Linnet and her crew's keep, on a hand that is exactly as possible as Tarrant's was not."},{"depth":1,"kind":"say","who":"DOM VELLORY","text":"Remarkable. The Linnet is yours, pilot, and the berth fee is waived, and I would take it as a courtesy if Ponyets House sent a different pilot next time. Kalgan remembers faces. Mine is a very good memory."},{"depth":1,"kind":"journal","text":"Kalgan. I played Vellory's table and heard the dealer as he heard the reader. The Linnet is ours again. Vellory remembers my face."},{"depth":0,"kind":"if","text":"if kalgan-expose"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You tell Corin where to look. It takes her one hand to see it. She has worked tables on three worlds, and she takes the empty seat beside the thin man, lays her cards face down, and talks to him pleasantly about nothing until he looks at them from habit. Then she names them aloud, to the room, before the dealer turns them."},{"depth":1,"kind":"say","who":"NARRATOR","text":"She does it twice more. By the third time the room is very quiet, and the players are looking at Dom Vellory, and Dom Vellory is looking at the thin man as at a piece of furniture that has broken."},{"depth":1,"kind":"say","who":"DOM VELLORY","text":"This man is not of the house. The house did not know him. The house regrets. Every wager at this table since the first bell is void, the Linnet is returned to her owners with the Palace's apology, and this man will explain himself to the Warlord, who takes a personal interest in honest tables."},{"depth":1,"kind":"say","who":"NARRATOR","text":"The thin man goes out between two large people and does not come back. Tarrant watches him go with no expression at all."},{"depth":1,"kind":"journal","text":"Kalgan. Corin showed the room the man who read hands for Vellory's dealer. Vellory voided the wagers and gave him to the Warlord. The Linnet is ours again. Vellory knew, and lost nothing."},{"depth":0,"kind":"if","text":"if kalgan-nudge"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the place in Vellory where the Linnet sits, which is pride, and the place beside it where Ponyets House sits, which is nothing much. You make the House a little heavier and the ship a little lighter. It takes a moment. It costs you something."},{"depth":1,"kind":"say","who":"DOM VELLORY","text":"The Linnet. Yes. On reflection the House is an old customer and a courier is a small thing between friends. Take her. Take the crew. The Palace keeps the wager and forgives the ship. Tell your House we are generous."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen does not look at you. She looks at Vellory, who is smiling at a thing he has decided to think, and then she looks at the floor."},{"depth":1,"kind":"say","who":"ILEN SARVO","text":"That was quick."},{"depth":1,"kind":"journal","text":"Kalgan. I made Vellory want to give the Linnet back. Ilen saw it. She said: that was quick."},{"depth":0,"kind":"say","who":"TAREN","text":"As you turn to go you feel it. One mind in the room was not thinking about money, or cards, or you. It was watching what you did the way a man watches weather, with interest and no surprise. You reach for it. It closes, like a hand, and when you look there is only a table and an empty glass."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Nobody in the room saw anyone leave."},{"depth":0,"kind":"set","text":"sets kalgan-watched"},{"depth":0,"kind":"journal","text":"Kalgan. Somebody in the Salon watched me work, and knew what they were watching, and closed their mind when I reached. I do not know who. I do not think it was the first time."},{"depth":0,"kind":"say","who":"NESSA TARRANT","text":"The House will recall me. It should. Seven hundred, pilot, from the factor's own account, and it was never the ship I minded losing. It was losing to a man who did not touch the cards."},{"depth":0,"kind":"credits","text":"+700 credits"},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Seven hundred, and the Linnet's crew eat on us tonight. Fair."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"complete","text":"complete kalgan-wager"},{"depth":0,"kind":"objective","text":"(cleared)"},{"depth":0,"kind":"end","text":"The Kalgan Wager is complete. The Linnet is returned to Ponyets House."}],"complete":"kalgan-wager","end":"The Kalgan Wager is complete. The Linnet is returned to Ponyets House."}]}]},{"id":"tazenda-tithe","title":"The Tazenda Tithe","subtitle":"A side adventure","main":false,"contract":{"world":"rossem","summary":"A Ponyets House relief mission on Rossem had a third of its cargo seized as tithe by the Tazendian governor, and the village Elders have hidden the ship's drive core from him. The House wants the mission flying before winter closes the port.","reward":"600 credits and the gratitude of a cold world"},"startWorld":"Rossem","rows":[{"title":"The Tazenda Tithe","sub":"Rossem","story":"tazenda-tithe","scenes":[{"id":"rossem-arrive","trigger":"ARRIVE · Rossem","places":[],"speakers":["NARRATOR","COMMS","CORIN PELLIS","ILEN SARVO"],"lines":4,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Tazenda Tithe · Rossem"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Rossem. A world at the edge of the map where the snow does not melt and the farmers wrap themselves in fur and are governed, lightly and from far away, by Tazenda. Tazenda takes a tithe. Rossem gives it. That is the whole of the arrangement, and it has lasted longer than the Foundation."},{"depth":0,"kind":"say","who":"COMMS","text":"Foundation ship, this is the Tazendian residency at Gentri. The relief mission in your House's name is under tithe assessment. Its cargo is impounded and its drive core is reported missing. You will land at the residency pad and you will not visit the village."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Reported missing. A drive core weighs two tons. It did not wander off. Somebody carried it into the snow, and on Rossem the only somebody with a sled is the village."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Elders. They hid it from the governor, not from us. If the mission cannot leave, the governor cannot take its cargo off-world, and the village gets to eat it."},{"depth":0,"kind":"objective","text":"Enter orbit over Rossem. Talk to the Elders, whatever the residency says."}],"chapter":{"title":"The Tazenda Tithe","sub":"Rossem"}},{"id":"rossem-orbit","trigger":"ORBIT · Rossem","places":["longhouse","space"],"speakers":["NARRATOR","ELDER TOKHAN","ILEN SARVO","GOVERNOR SARIN","TAREN","CORIN PELLIS"],"lines":23,"journal":3,"sets":["rossem-pay","rossem-charter","rossem-nudge"],"checks":["rossem-pay","rossem-charter","rossem-nudge"],"choices":[{"text":"Pay the tithe in credits, on the House's account. Let the village keep the grain.","set":["rossem-pay"],"credits":-400},{"text":"Let Ilen read him the charter. Tazenda exempts ships in distress, and Corin can make a log say distress.","set":["rossem-charter"]},{"text":"Reach into Sarin. Make the report in his head already written, and favourable.","set":["rossem-nudge"],"strain":1}],"branches":[{"flags":["rossem-pay"],"lines":3,"sets":[]},{"flags":["rossem-charter"],"lines":6,"sets":[]},{"flags":["rossem-nudge"],"lines":3,"sets":[]}],"credits":600,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You do not land at the residency pad. You put the Kestrel down in a field of snow beside a long low house of logs with smoke coming out of the roof, and before the engines are cold the door opens and a man in furs waves you in out of the wind."},{"depth":0,"kind":"enter","text":"enter longhouse"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Fire, fur, the smell of wet wool and smoke. Benches along the walls and old men on them, and at the end an older man in a bearskin with the look of someone who has buried more winters than you have flown."},{"depth":0,"kind":"say","who":"ELDER TOKHAN","text":"Sit by the fire. Guests sit by the fire. We are a poor people and we have no manners but that one. You are the House's pilot. The House sent grain, and medicine, and seed, and the governor sent a tithe assessor, and so the core is under my floor and the governor can stand in the snow and whistle for it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"He will not whistle. He will burn your stores."},{"depth":0,"kind":"say","who":"ELDER TOKHAN","text":"He will. He has said so. He comes at dark to say so again. He likes to say things twice."},{"depth":0,"kind":"say","who":"NARRATOR","text":"The door opens on the wind, and a man in a grey Tazendian uniform comes in with two troopers and a cold that is not only the weather. Governor Sarin. He does not sit. He looks at the fire as at a thing that has been lit without a permit."},{"depth":0,"kind":"say","who":"GOVERNOR SARIN","text":"Pilot. You were told to land at the residency. You landed here. That is a fine. The tithe on the relief cargo is a third, by weight, by the charter of Tazenda, which is older than your Foundation and will outlast it. The core is produced by dark or the village stores are burned as a lesson in arithmetic. I regret the necessity. I regret very little else."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense. Sarin is not cruel. He is afraid, of Tazenda, of a report with his name on it that says a Foundation ship left Rossem without paying. The Elder is not afraid of anything. The Elder is tired, and would like, very much, to be allowed to be kind."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Pay the tithe in credits, on the House's account. Let the village keep the grain.","meta":"-400 cr · sets rossem-pay"},{"depth":1,"kind":"option","text":"Let Ilen read him the charter. Tazenda exempts ships in distress, and Corin can make a log say distress.","meta":"sets rossem-charter"},{"depth":1,"kind":"option","text":"Reach into Sarin. Make the report in his head already written, and favourable.","meta":"strain +1 · sets rossem-nudge"},{"depth":0,"kind":"if","text":"if rossem-pay"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You put four hundred on the Elder's table, in Foundation credits, which on Rossem are worth more than Tazendian ones and everybody present knows it. Sarin counts them with a face that is trying not to be relieved."},{"depth":1,"kind":"say","who":"GOVERNOR SARIN","text":"The tithe is assessed and received. The relief cargo is released. The matter of the core is not in my report. Produce it by morning. Pilot, I will say this once: the House is welcome on Rossem. Tazenda, less so."},{"depth":1,"kind":"say","who":"ELDER TOKHAN","text":"He said it once. Write that down, girl. It is the first thing in forty years he has said once."},{"depth":1,"kind":"journal","text":"Rossem. I paid the governor's tithe in credits so the village could keep the grain. Sarin said the House was welcome, once."},{"depth":0,"kind":"if","text":"if rossem-charter"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen stands up by the fire with a copy of the Charter of Tazenda, which she has read, because she reads everything. Article nine. A vessel in distress pays no tithe on cargo landed for its own repair."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin has already made the Kestrel's log say distress. It is a very good log. The core, she explains, failed on approach. That is why it was removed. That is why the village had to carry it, in the snow, at the House's request. The House is grateful. The House would like it noted."},{"depth":1,"kind":"say","who":"GOVERNOR SARIN","text":"Article nine. I know article nine. Nobody has invoked article nine on Rossem in a hundred years, because nobody on Rossem can read. I will need the log. I will need it to be very good."},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"It is very good."},{"depth":1,"kind":"say","who":"GOVERNOR SARIN","text":"Then the vessel is in distress, the cargo is landed for repair, and there is no tithe. There is a fine for the landing. I will take the fine in grain, which the village will carry to the residency, and the village will, I expect, carry less than it is told."},{"depth":1,"kind":"say","who":"ELDER TOKHAN","text":"The village is old and the snow is deep. Things fall off sleds."},{"depth":1,"kind":"journal","text":"Rossem. Ilen invoked article nine of the Charter of Tazenda, and Corin's log said distress. No tithe. The fine was in grain, and things fall off sleds."},{"depth":0,"kind":"if","text":"if rossem-nudge"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the report in Sarin. It is already half written, in the part of a man that writes reports in his sleep. You finish it for him. The core was never missing. The tithe was taken in kind, and was light, because of the winter. Tazenda will approve. Tazenda will not read it."},{"depth":1,"kind":"say","who":"GOVERNOR SARIN","text":"The matter is closed. The tithe was taken in kind. Light, because of the winter. Produce the core, pilot, and go, and the village keeps its stores, and I have a report to write that I find I have mostly written."},{"depth":1,"kind":"say","who":"NARRATOR","text":"He goes out into the dark with his troopers. The Elder watches the door close and then watches you, for a long time, and says nothing, which on Rossem is a kind of speech."},{"depth":1,"kind":"journal","text":"Rossem. I wrote Sarin's report inside his head. The Elder watched me, and said nothing."},{"depth":0,"kind":"say","who":"NARRATOR","text":"In the morning the core comes up through the Elder's floor on six men and a sled, and goes into the relief ship, and the relief ship goes up through the snow with a sound the village comes out to hear."},{"depth":0,"kind":"say","who":"ELDER TOKHAN","text":"The House will pay you. Rossem cannot. But if you are ever cold, pilot, and you will be, there is a bench by this fire with no one on it."},{"depth":0,"kind":"credits","text":"+600 credits"},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Six hundred from the House. Minus what you paid, if you paid. I have stopped counting. I count again at the next port."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"complete","text":"complete tazenda-tithe"},{"depth":0,"kind":"objective","text":"(cleared)"},{"depth":0,"kind":"end","text":"The Tazenda Tithe is complete. The relief mission is flying and the village has its stores."}],"complete":"tazenda-tithe","end":"The Tazenda Tithe is complete. The relief mission is flying and the village has its stores."}]}]},{"id":"encyclopedia-errand","title":"The Encyclopedia Errand","subtitle":"A side adventure","main":false,"contract":{"world":"melpomenia","summary":"The Encyclopedia Board wants a full scan of the Melpomenia roll, the stone list of the fifty Spacer worlds in a dead hall on a dead world. Ilen asked for this one herself.","reward":"400 credits from the Board, and a line in the Encyclopedia"},"startWorld":"Melpomenia","rows":[{"title":"The Encyclopedia Errand","sub":"Melpomenia","story":"encyclopedia-errand","scenes":[{"id":"melp-arrive","trigger":"ARRIVE · Melpomenia","places":[],"speakers":["NARRATOR","ILEN SARVO","CORIN PELLIS"],"lines":3,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Encyclopedia Errand · Melpomenia"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Melpomenia. One of the fifty Spacer worlds, dead for twenty thousand years. The air is thin and the carbon dioxide in it will kill you in an hour, which is why nobody comes here, which is why a stone in a hall here still says what it said when the Spacers carved it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The roll of the fifty worlds. Every Spacer world, with its distance from Earth. The Board has a copy of a copy of a sketch. I want the stone."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"There is a ship down there already. Comporellon registry, salvage class. Salvagers do not come to dead worlds for the view."},{"depth":0,"kind":"objective","text":"Enter orbit over Melpomenia. Masks on. Find the hall of the fifty worlds."}],"chapter":{"title":"The Encyclopedia Errand","sub":"Melpomenia"}},{"id":"melp-orbit","trigger":"ORBIT · Melpomenia","places":["ruins · the Hall of the Fifty Worlds on Melpomenia","space"],"speakers":["NARRATOR","MIRA HEKT","ILEN SARVO","TAREN","CORIN PELLIS"],"lines":19,"journal":3,"sets":["melp-buy","melp-trade","melp-nudge"],"checks":["melp-buy","melp-trade","melp-nudge"],"choices":[{"text":"Buy the slab with the hole in it. Three hundred, in Foundation credits.","set":["melp-buy"],"credits":-300},{"text":"Offer Hekt the Kestrel's spare drive coils. Salvage wants parts more than money.","set":["melp-trade"]},{"text":"Reach into her. Make the hole worthless to her.","set":["melp-nudge"],"strain":1}],"branches":[{"flags":["melp-buy"],"lines":2,"sets":[]},{"flags":["melp-trade"],"lines":2,"sets":[]},{"flags":["melp-nudge"],"lines":3,"sets":[]}],"credits":400,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You go down in masks, through a city that is all roofs fallen in and grey moss on everything, to a hall whose doors are long gone and whose stone is not."},{"depth":0,"kind":"enter","text":"enter ruins · the Hall of the Fifty Worlds on Melpomenia · cast ILEN SARVO, CORIN PELLIS, WRECK + MIRA HEKT"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The roll is on the far wall, fifty names in a script Ilen can read and you cannot, and a robot lies in front of it with its chest open, the way they have been finding them on every dead world since Aurora. Beside the robot, in a salvage suit with the Comporellon crest, a woman is cutting the stone."},{"depth":0,"kind":"say","who":"MIRA HEKT","text":"Mira Hekt. Hekt Salvage, out of Comporellon. This is my claim, I filed it, and the filing office on Comporellon is three hundred parsecs away, so the claim is this cutter. The stone is spoken for. A collector on Comporellon pays by the name. I have forty-nine names. I am cutting the fiftieth."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Which one?"},{"depth":0,"kind":"say","who":"MIRA HEKT","text":"The one somebody already cut out, a long time ago. See? There is a hole where a name was. The collector pays double for the hole. He says a hole with a story in it is worth more than a name."},{"depth":0,"kind":"say","who":"TAREN","text":"You look at the hole. It is old. The chisel marks are older than the moss. Somebody came to a dead world, to a hall nobody would ever read, and took one name off the roll of the fifty, and went away again. You know whose name it was. It is the only name anyone has ever bothered to take away."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Earth. It would have been Earth. The distance would have been zero."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Can we have the hole, Hekt? Name a price. We are a trading House. We like prices."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Buy the slab with the hole in it. Three hundred, in Foundation credits.","meta":"-300 cr · sets melp-buy"},{"depth":1,"kind":"option","text":"Offer Hekt the Kestrel's spare drive coils. Salvage wants parts more than money.","meta":"sets melp-trade"},{"depth":1,"kind":"option","text":"Reach into her. Make the hole worthless to her.","meta":"strain +1 · sets melp-nudge"},{"depth":0,"kind":"if","text":"if melp-buy"},{"depth":1,"kind":"say","who":"MIRA HEKT","text":"Three hundred Foundation. That is more than the collector, and the collector is three hundred parsecs away and you are here. Sold. I will even cut it clean."},{"depth":1,"kind":"say","who":"NARRATOR","text":"She cuts it clean. Ilen scans the roll first, every name, twice, with Hekt holding the lamp and not charging for it."},{"depth":1,"kind":"journal","text":"Melpomenia. I bought the slab with the hole in it from Mira Hekt for three hundred credits. Ilen scanned the roll of the fifty. The hole was Earth."},{"depth":0,"kind":"if","text":"if melp-trade"},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"Two drive coils, Kestrel pattern, new. You know what those are worth on Comporellon. We know what they are worth. Nobody has to say it."},{"depth":1,"kind":"say","who":"MIRA HEKT","text":"Coils. For a stone with a hole in it. You people are either very stupid or you know something, and I have been in salvage long enough to know which one pays. Take the hole. Take the robot too, it is no good to me. The chest is empty."},{"depth":1,"kind":"journal","text":"Melpomenia. Corin traded two drive coils for the slab with the hole in it. Hekt said the robot's chest was empty. Ilen scanned the roll of the fifty. The hole was Earth."},{"depth":0,"kind":"if","text":"if melp-nudge"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the collector in her, and the price, and the hole, and you make the hole small, and cheap, and a little embarrassing to have mentioned. It takes a moment. The moss on the wall is very green."},{"depth":1,"kind":"say","who":"MIRA HEKT","text":"Take it. A hole. What was I thinking. Forty-nine names is a roll. A hole is a hole. Take it and get off my claim."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen scans the roll with her back to you. She has worked out, by now, what it means when things become cheap."},{"depth":1,"kind":"journal","text":"Melpomenia. I made Mira Hekt think the hole was worthless. Ilen scanned the roll with her back to me. The hole was Earth."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Before you go, you stand over the robot for a moment. Its chest is open and empty, and somebody has taken, very carefully, with the right tools, whatever was in it. Not a salvager. Salvagers do not use the right tools."},{"depth":0,"kind":"say","who":"TAREN","text":"Somebody has been to every dead world before you. Taking names. Taking memories. Being careful."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Board gets a scan. The Encyclopedia gets fifty names and one hole. I will write the hole up myself, in the voice for footnotes. The Board will not read it. Somebody will."},{"depth":0,"kind":"credits","text":"+400 credits"},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Four hundred from the Board. The Board pays like a Board."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"complete","text":"complete encyclopedia-errand"},{"depth":0,"kind":"objective","text":"(cleared)"},{"depth":0,"kind":"end","text":"The Encyclopedia Errand is complete. The roll of the fifty worlds is in the Encyclopedia, hole and all."}],"complete":"encyclopedia-errand","end":"The Encyclopedia Errand is complete. The roll of the fifty worlds is in the Encyclopedia, hole and all."}]}]},{"id":"time-vault","title":"The Time Vault","subtitle":"A side adventure","main":false,"contract":{"world":"terminus","summary":"The Time Vault on Terminus ran an unscheduled self-test. Its keeper will not say more on an open channel. The Encyclopedia Board wants it looked at quietly, by someone who is not from Terminus.","reward":"600 credits from the Board, quietly","requires":["kalgan-watched"]},"startWorld":"Terminus","rows":[{"title":"The Time Vault","sub":"Terminus","story":"time-vault","scenes":[{"id":"vault-arrive","trigger":"ARRIVE · Terminus","places":[],"speakers":["NARRATOR","COMMS","ILEN SARVO","CORIN PELLIS"],"lines":4,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"The Time Vault · Terminus"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Terminus. The Foundation's own world, at the end of everything, where Hari Seldon put a hundred thousand Encyclopedists and a vault, and left. The vault opens at crises. There is no crisis. The vault has done something anyway."},{"depth":0,"kind":"say","who":"COMMS","text":"Trader vessel, Terminus City control. You are expected. The Board asks that you come to the Vault directly, by the service road, and that you do not file a reason."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Vault keeper is Dorne. I knew him when he was a clerk. He is not a man who calls the Board at night."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Nobody who is not from Terminus is allowed in that room. The Board is bending a rule it would hang a Trader for. Either it is frightened or it is testing you. On Terminus it is usually both."},{"depth":0,"kind":"objective","text":"Enter orbit over Terminus. Go to the Time Vault by the service road."}],"chapter":{"title":"The Time Vault","sub":"Terminus"}},{"id":"vault-orbit","trigger":"ORBIT · Terminus","places":["timevault","space"],"speakers":["NARRATOR","KEEPER DORNE","CHAIR AMMEL","TAREN","ILEN SARVO","STUDENT"],"lines":22,"journal":4,"sets":["vault-silent","vault-record","vault-nudge","vault-watched"],"checks":["vault-silent","vault-record","vault-nudge"],"choices":[{"text":"Tell him to write: self-test, nominal. Let the Vault keep its secret.","set":["vault-silent"]},{"text":"Let Ilen take the eleven minutes for the Encyclopedia. Everything gets written down somewhere.","set":["vault-record"]},{"text":"Reach into Dorne. Take the night away from him.","set":["vault-nudge"],"strain":1}],"branches":[{"flags":["vault-silent"],"lines":2,"sets":[]},{"flags":["vault-record"],"lines":3,"sets":[]},{"flags":["vault-nudge"],"lines":3,"sets":[]}],"credits":600,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The service road. A door with no sign. And then the room every schoolchild in the Foundation has seen in pictures: rows of seats, a wall, and a glass cubicle with an empty chair in it where, three times in two centuries, a dead man has sat down and talked."},{"depth":0,"kind":"enter","text":"enter timevault"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Keeper Dorne is a small grey man who has not slept. Chair Ammel of the Board stands beside him as a wall stands beside a door. In the back row, where the public sits at openings, a young woman with a student's satchel is reading something, and does not look up."},{"depth":0,"kind":"say","who":"KEEPER DORNE","text":"Encyclopedist Sarvo. And the pilot. Thank you. I will say this once, because the Chair has asked me to and because I need to say it to someone. Two nights ago, at the third hour, the Vault's recorder activated. Not the projector. The recorder. It recorded for eleven minutes. There is no recorder on the schedule. There is no schedule for a recorder. Seldon did not leave one."},{"depth":0,"kind":"say","who":"CHAIR AMMEL","text":"The Board's position is that the Vault performed a self-test. That is the position. It has been the position since the morning after. I have asked the pilot here because the pilot is not from Terminus, and will leave, and because Sarvo says he sees things."},{"depth":0,"kind":"say","who":"KEEPER DORNE","text":"I played it back. The eleven minutes. There is nothing on it. There is a room, and the seats, and the chair, and nothing. And at the ninth minute, somebody breathes."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense. Dorne is telling the truth and is more frightened of it than of the Board. Ammel is lying, carefully, to herself, and knows it. And in the back row the student is not reading. The student is a closed hand. You have met this hand before, on Kalgan, across a table."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"What do you want from us, Keeper?"},{"depth":0,"kind":"say","who":"KEEPER DORNE","text":"I want somebody to tell me what to write in the log."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Tell him to write: self-test, nominal. Let the Vault keep its secret.","meta":"sets vault-silent"},{"depth":1,"kind":"option","text":"Let Ilen take the eleven minutes for the Encyclopedia. Everything gets written down somewhere.","meta":"sets vault-record"},{"depth":1,"kind":"option","text":"Reach into Dorne. Take the night away from him.","meta":"strain +1 · sets vault-nudge"},{"depth":0,"kind":"if","text":"if vault-silent"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You tell him. Self-test, nominal. He writes it, slowly, like a man signing something, and when he has written it he looks ten years older and a great deal calmer."},{"depth":1,"kind":"say","who":"CHAIR AMMEL","text":"That is the position. The Board thanks the pilot. The Board will not remember the pilot's name, which is the greatest courtesy the Board has."},{"depth":1,"kind":"journal","text":"Terminus. The Vault's recorder ran for eleven minutes and somebody breathed on the ninth. I told Dorne to log it as a self-test. The Board was grateful not to know."},{"depth":0,"kind":"if","text":"if vault-record"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen copies the eleven minutes onto a cube the size of a thumb. Ammel watches her do it with the face of a woman watching a fire start in a building she does not own."},{"depth":1,"kind":"say","who":"CHAIR AMMEL","text":"That cube does not exist. The Encyclopedia does not have it. If it is ever found in the Encyclopedia, the Encyclopedia will have found it somewhere else."},{"depth":1,"kind":"say","who":"ILEN SARVO","text":"Everything is found somewhere else, Chair. That is what an encyclopedia is."},{"depth":1,"kind":"journal","text":"Terminus. The Vault's recorder ran for eleven minutes and somebody breathed on the ninth. Ilen has the eleven minutes on a cube that does not exist."},{"depth":0,"kind":"if","text":"if vault-nudge"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the night in Dorne. The third hour, the recorder, the ninth minute. You do not take it. You fold it, the way a man folds a letter he will read again when he is braver, and you put it where he will not find it for a long time."},{"depth":1,"kind":"say","who":"KEEPER DORNE","text":"The self-test. Yes. Self-test, nominal. I had thought there was something else. I had not slept. Thank you for coming, Encyclopedist. I do not know why the Chair called you."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ammel looks at Dorne, and then at you, and decides to be relieved rather than curious. It is the Board's oldest skill."},{"depth":1,"kind":"journal","text":"Terminus. I folded the night away inside Keeper Dorne. He thinks the Vault ran a self-test. The Chair decided not to be curious."},{"depth":0,"kind":"say","who":"NARRATOR","text":"On the way out the student is standing by the door, as if she had always been there. She is young, and plain, and unremarkable, and she looks at you the way nobody has looked at you in sixty years: as if she knew exactly what she was looking at."},{"depth":0,"kind":"say","who":"STUDENT","text":"You are being careful. Keep being careful. Nobody is in your way, pilot. Nobody will be. That is not a kindness. It is a decision, and it was not mine to make, and it was made a long time ago."},{"depth":0,"kind":"say","who":"TAREN","text":"You reach for her, and there is nothing to reach. Not a closed hand this time. An open one, with nothing in it, held out for you to see."},{"depth":0,"kind":"say","who":"STUDENT","text":"The breath on the recording was mine. I wanted to know if the room still listens. It does. Goodbye."},{"depth":0,"kind":"say","who":"NARRATOR","text":"She goes out into the Terminus afternoon with her satchel and does not look back, and nobody in the room but you saw her leave, and Ilen, who sees everything, is looking at you."},{"depth":0,"kind":"set","text":"sets vault-watched"},{"depth":0,"kind":"journal","text":"Terminus. The student by the door spoke to me. She said I was being careful, and to keep being careful, and that nobody would be in my way. She said the breath on the recording was hers. I could not read her. She let me see that I could not."},{"depth":0,"kind":"credits","text":"+600 credits"},{"depth":0,"kind":"say","who":"CHAIR AMMEL","text":"Six hundred, from a fund the Board does not have, for a visit that did not happen. Fly well, pilot."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"complete","text":"complete time-vault"},{"depth":0,"kind":"objective","text":"(cleared)"},{"depth":0,"kind":"end","text":"The Time Vault is complete. The Board has its position. Somebody on Terminus knows what you are."}],"complete":"time-vault","end":"The Time Vault is complete. The Board has its position. Somebody on Terminus knows what you are."}]}]}]};
const board = document.getElementById('board'), world = document.getElementById('world'), edgesSvg = document.getElementById('edges'), cardsEl = document.getElementById('cards'), drawer = document.getElementById('drawer');
const CARD_W = 300, GAP_X = 40, GAP_Y = 70, LABEL_W = 220, TOP = 40;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const cards = new Map(); // scene id -> { el, card, story, x, y, w, h }

// ---- build the cards
let sceneCount = 0, lineCount = 0, choiceCount = 0; const flagSet = new Set(), castSet = new Set();
for (const story of DATA.stories) for (const row of story.rows) for (const c of row.scenes) {
  sceneCount++; lineCount += c.lines; choiceCount += c.choices.length; c.sets.forEach((f) => flagSet.add(f)); c.speakers.forEach((s) => castSet.add(s));
  const el = document.createElement('article'); el.className = 'card' + (c.end ? ' end' : ''); el.tabIndex = 0; el.dataset.id = c.id;
  let h = `<h3>${esc(c.id)}</h3><div class="trigger">${esc(c.trigger)}</div>`;
  const chips = [];
  for (const p of c.places) chips.push(`<span class="chip place">→ ${esc(p.split(' · ')[0])}</span>`);
  for (const s of c.speakers) if (s !== 'NARRATOR') chips.push(`<span class="chip who">${esc(s)}</span>`);
  if (chips.length) h += `<div class="chips">${chips.join('')}</div>`;
  const m = [`<b>${c.lines}</b> lines`]; if (c.journal) m.push(`<b>${c.journal}</b> journal`); if (c.credits) m.push(`<b>${c.credits > 0 ? '+' : ''}${c.credits}</b> cr`); if (c.strain) m.push(`strain <b>${c.strain > 0 ? '+' : ''}${c.strain}</b>`); if (c.crew.length) m.push(`crew: <b>${esc(c.crew.join(', '))}</b>`); if (c.unlocks.length) m.push(`unlocks <b>${esc(c.unlocks.join(', '))}</b>`);
  h += `<div class="meter">${m.join(' · ')}</div>`;
  if (c.choices.length) h += `<ol class="choices">${c.choices.map((ch) => { const t = [ch.strain ? `strain +${ch.strain}` : '', ch.credits ? `${ch.credits > 0 ? '+' : ''}${ch.credits} cr` : '', ch.needs?.length ? `needs ${ch.needs.join(', ')}` : '', ch.maxStrain !== undefined ? `strain ≤ ${ch.maxStrain}` : ''].filter(Boolean).join(' · '); return `<li>${esc(ch.text)}${t ? ` <span>${esc(t)}</span>` : ''}</li>`; }).join('')}</ol>`;
  for (const b of c.branches) h += `<div class="branch">if <code>${esc(b.flags.join(' + '))}</code>: ${b.lines} lines${b.else !== undefined ? ` · else ${b.else}` : ''}</div>`;
  const fl = [];
  for (const f of c.sets) fl.push(`<span class="chip set">${esc(f)}</span>`);
  for (const f of c.checks) fl.push(`<span class="chip check">? ${esc(f)}</span>`);
  if (fl.length) h += `<div class="chips">${fl.join('')}</div>`;
  if (c.complete) h += `<div class="endtext">completes ${esc(c.complete)}</div>`;
  if (c.end) h += `<div class="endtext">END · ${esc(c.end)}</div>`;
  el.innerHTML = h;
  el.addEventListener('click', () => select(c.id));
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(c.id); } });
  cardsEl.appendChild(el);
  cards.set(c.id, { el, card: c, story, x: 0, y: 0, w: CARD_W, h: 0 });
}
document.getElementById('stats').innerHTML = `<span><b>${DATA.stories.length}</b> stories</span><span><b>${sceneCount}</b> scenes</span><span><b>${lineCount}</b> lines</span><span><b>${choiceCount}</b> choices</span><span><b>${flagSet.size}</b> flags</span><span><b>${castSet.size - 1}</b> voices</span>`;
document.getElementById('gen').textContent = `Foundation · generated from the story files · ${DATA.generated}`;

// ---- layout: one row per chapter or side adventure
let y = TOP, worldW = 0, worldH = 0;
const labels = [];
for (const story of DATA.stories) {
  if (!story.main) {
    const lab = document.createElement('div'); lab.className = 'row-label story';
    lab.innerHTML = `${esc(story.title)}<small>${esc(story.subtitle)} · ${esc(story.startWorld)}</small>${story.contract?.requires?.length ? `<div class="req">needs ${esc(story.contract.requires.join(', '))}</div>` : ''}`;
    lab.style.left = '16px'; lab.style.top = y + 'px'; cardsEl.appendChild(lab);
  }
  for (const row of story.rows) {
    const lab = document.createElement('div'); lab.className = 'row-label';
    lab.innerHTML = story.main ? `${esc(row.title)}<small>${esc(row.sub ?? '')}</small>` : `<small>${esc(story.contract?.summary ?? '')}</small>`;
    lab.style.left = '16px'; lab.style.top = (y + (story.main ? 0 : 54)) + 'px'; cardsEl.appendChild(lab);
    let x = LABEL_W, rowH = 0;
    for (const c of row.scenes) { const k = cards.get(c.id); k.x = x; k.y = y; k.el.style.left = x + 'px'; k.el.style.top = y + 'px'; k.h = k.el.offsetHeight; rowH = Math.max(rowH, k.h); x += CARD_W + GAP_X; }
    worldW = Math.max(worldW, x);
    const rule = document.createElement('div'); rule.className = 'row-rule'; rule.style.left = '16px'; rule.style.top = (y + rowH + GAP_Y / 2) + 'px'; rule.style.width = (worldW - 16) + 'px'; cardsEl.appendChild(rule); labels.push(rule);
    y += rowH + GAP_Y;
  }
}
worldH = y;
for (const r of labels) r.style.width = (worldW - 16) + 'px';
edgesSvg.setAttribute('width', worldW); edgesSvg.setAttribute('height', worldH);

// ---- edges: flag setters to flag consumers, and gotos
const setters = new Map();
for (const k of cards.values()) for (const f of k.card.sets) { if (!setters.has(f)) setters.set(f, []); setters.get(f).push(k); }
const edges = [];
function link(a, b, cls, label) {
  const x1 = a.x + a.w, y1 = a.y + Math.min(a.h, 40), x2 = b.x, y2 = b.y + Math.min(b.h, 40);
  const dx = Math.max(60, Math.abs(x2 - x1) * 0.4);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`);
  p.setAttribute('class', cls); const t = document.createElementNS('http://www.w3.org/2000/svg', 'title'); t.textContent = label; p.appendChild(t);
  edgesSvg.appendChild(p); edges.push({ p, a: a.card.id, b: b.card.id });
}
for (const k of cards.values()) {
  for (const f of k.card.checks) for (const s of setters.get(f) ?? []) if (s !== k) link(s, k, 'flag', f);
  for (const g of k.card.gotos) { const t = cards.get(g); if (t) link(k, t, 'goto', 'goto ' + g); }
  const req = k.story.contract?.requires ?? [];
