<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Foundation Storyboard</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a fixed chart-room screen. A top bar, an infinite board below, a script drawer on the right. */
:root {
  --bg: #050a14; --bg2: #0b1424; --panel: rgba(6, 14, 28, 0.92); --fg: #dbe8f5; --dim: #7f95b0; --line: rgba(63, 212, 255, 0.28);
  --cyan: #3fd4ff; --amber: #ffc14d; --green: #7dffb0; --red: #ff6b6b; --card: #0d1a2e; --card-edge: #1d3350; --grid: rgba(120, 160, 210, 0.08);
  --display: 'Barlow Condensed', 'Helvetica Neue', Arial, sans-serif; --body: 'Barlow', 'Helvetica Neue', Arial, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #eef2f7; --bg2: #e3e9f1; --panel: rgba(248, 250, 253, 0.94); --fg: #142033; --dim: #5a6c84; --line: rgba(10, 110, 160, 0.3);
  --cyan: #0a7fb5; --amber: #a86a00; --green: #1f8a4c; --red: #c23b3b; --card: #ffffff; --card-edge: #c9d5e4; --grid: rgba(20, 50, 90, 0.08); color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #eef2f7; --bg2: #e3e9f1; --panel: rgba(248, 250, 253, 0.94); --fg: #142033; --dim: #5a6c84; --line: rgba(10, 110, 160, 0.3);
  --cyan: #0a7fb5; --amber: #a86a00; --green: #1f8a4c; --red: #c23b3b; --card: #ffffff; --card-edge: #c9d5e4; --grid: rgba(20, 50, 90, 0.08); color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); z-index: 5; }
header h1 { margin: 0; font: 600 20px/1 var(--display); letter-spacing: 0.22em; text-transform: uppercase; }
header h1 small { display: block; margin-top: 4px; font: 500 10px/1 var(--body); letter-spacing: 0.2em; color: var(--dim); }
.stats { display: flex; gap: 14px; font: 500 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.tools { display: flex; gap: 8px; align-items: center; margin-left: auto; }
input[type=search] { font: inherit; padding: 6px 10px; width: 200px; max-width: 100%; background: var(--bg2); color: var(--fg); border: 1px solid var(--card-edge); border-radius: 3px; }
button { font: 500 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 10px; background: transparent; color: var(--cyan); border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
button:hover { background: var(--bg2); }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
#board { position: relative; overflow: hidden; cursor: grab; touch-action: none; background: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 48px 48px; }
#board.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#edges path { fill: none; stroke: var(--amber); stroke-width: 1.5; opacity: 0.35; }
#edges path.hot { opacity: 1; stroke-width: 2.5; }
#edges path.goto { stroke: var(--cyan); stroke-dasharray: 5 4; }
.row-label { position: absolute; width: 190px; font: 600 15px/1.2 var(--display); letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg); }
.row-label small { display: block; margin-top: 4px; font: 500 10px/1.3 var(--body); letter-spacing: 0.14em; color: var(--dim); }
.row-label.story { color: var(--amber); }
.row-label .req { margin-top: 6px; font: 400 10px/1.3 var(--mono); color: var(--amber); letter-spacing: 0; text-transform: none; }
.row-rule { position: absolute; height: 1px; background: var(--line); opacity: 0.5; }
.card { position: absolute; width: 300px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 10px 12px 12px; font-size: 12px; line-height: 1.4; cursor: pointer; transition: opacity 0.15s, border-color 0.15s; }
.card:hover { border-color: var(--cyan); }
.card.active { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber); }
.card.faded { opacity: 0.18; }
.card.end { border-color: var(--green); }
.card h3 { margin: 0; font: 500 12px/1.2 var(--mono); color: var(--cyan); word-break: break-all; }
.trigger { margin-top: 6px; font: 600 10px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.chip { padding: 2px 6px; border-radius: 2px; font: 500 10px/1.3 var(--body); letter-spacing: 0.04em; border: 1px solid var(--card-edge); color: var(--dim); background: transparent; }
.chip.place { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
.chip.set { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); font-family: var(--mono); font-size: 9.5px; }
.chip.check { color: var(--cyan); border-color: color-mix(in srgb, var(--cyan) 40%, transparent); font-family: var(--mono); font-size: 9.5px; }
.chip.who { color: var(--fg); }
.meter { margin-top: 8px; font: 400 11px/1.3 var(--body); color: var(--dim); font-variant-numeric: tabular-nums; }
.meter b { color: var(--fg); font-weight: 500; }
ol.choices { margin: 8px 0 0; padding-left: 18px; }
ol.choices li { margin: 3px 0; color: var(--fg); }
ol.choices li span { color: var(--dim); font-size: 10.5px; white-space: nowrap; }
.branch { margin-top: 6px; padding-left: 8px; border-left: 2px solid var(--amber); font-size: 11px; color: var(--dim); }
.branch code { font: 400 10px var(--mono); color: var(--amber); }
.endtext { margin-top: 8px; font-size: 11px; color: var(--green); }
#drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(460px, 100%); background: var(--panel); border-left: 1px solid var(--line); overflow: auto; padding-block: 16px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 6; backdrop-filter: blur(6px); }
#drawer h2 { margin: 0; font: 500 16px/1.2 var(--mono); color: var(--cyan); word-break: break-all; }
#drawer .sub { margin: 6px 0 14px; font: 500 10px/1.3 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); }
#drawer .close { position: sticky; top: 0; float: right; margin-left: 8px; }
.line { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 6px 0; border-top: 1px solid var(--card-edge); font-size: 13px; line-height: 1.45; }
.line .who { font: 500 10px/1.6 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.line.narr .who { color: var(--dim); }
.line.sys { font-size: 11.5px; color: var(--dim); }
.line.sys .who { color: var(--cyan); }
.line.option { font-size: 12.5px; }
.line.option .who { color: var(--green); }
.line .meta { display: block; font: 400 10.5px/1.5 var(--mono); color: var(--dim); }
.line.d1 { margin-left: 14px; border-left: 2px solid var(--amber); padding-left: 10px; }
.line.d2 { margin-left: 28px; border-left: 2px solid var(--amber); padding-left: 10px; }
.legend { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; flex-wrap: wrap; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 3px; font: 500 10px/1 var(--body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); z-index: 5; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--amber); vertical-align: middle; margin-right: 5px; }
.legend i.goto { border-top-style: dashed; border-color: var(--cyan); }
.legend b { display: inline-block; width: 10px; height: 10px; vertical-align: middle; margin-right: 5px; border: 1px solid var(--amber); border-radius: 2px; }
.legend b.check { border-color: var(--cyan); }
.legend b.place { border-color: var(--green); }
@media (max-width: 720px) { header h1 { font-size: 16px; } .stats { display: none; } input[type=search] { width: 140px; } .legend { display: none; } }
@media (prefers-reduced-motion: reduce) { .card, #edges path { transition: none; } }
</style>

<script>
const DATA = {"generated":"2026-10-25","stories":[{"id":"second-mind","title":"The Second Mind","subtitle":"A story of the Foundation era","main":true,"startWorld":"Terminus","rows":[{"title":"Chapter One","sub":"Terminus","story":"second-mind","scenes":[{"id":"ch1-start","trigger":"START","places":[],"speakers":["NARRATOR","TAREN","COMMS","ILEN SARVO"],"lines":12,"journal":0,"sets":["read-ilen","quiet-start","inspected","nudged","fugitive"],"checks":["read-ilen"],"choices":[{"text":"Read her. (Use the sense.)","set":["read-ilen"]},{"text":"Say nothing. Lift.","set":["quiet-start"]},{"text":"Comply. Let them board.","set":["inspected"],"goto":"ch1-inspected"},{"text":"Reach into the inspector's mind and turn him away.","set":["nudged"],"strain":1,"goto":"ch1-nudged"},{"text":"Run. Full burn out of Terminus space.","set":["fugitive"],"goto":"ch1-run"}],"branches":[{"flags":["read-ilen"],"lines":2,"sets":[],"else":1}],"credits":0,"strain":0,"gotos":["ch1-inspected","ch1-nudged","ch1-run"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter One · Terminus"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Foundation Era 210. Terminus, at the edge of the Galaxy. The Encyclopedia is still being written. The Empire is still dying. Nobody remembers Earth."},{"depth":0,"kind":"say","who":"TAREN","text":"You are R. Taren Vesk. You fly a light freighter for Ponyets House, a Trader concern that asks no questions of a pilot who never sleeps and never makes a mistake. You have kept your nature secret for sixty years."},{"depth":0,"kind":"say","who":"TAREN","text":"There is one thing you cannot explain. A directive with no source. Find the origin. You do not know whose origin."},{"depth":0,"kind":"say","who":"COMMS","text":"Ponyets House to freighter Kestrel. One passenger, one cargo, bound for Radole. Manifest says archive tapes under Encyclopedia seal. Pilot, you are cleared to load."},{"depth":0,"kind":"say","who":"NARRATOR","text":"A woman comes up the ramp with two sealed cases and no luggage. She is thirty, perhaps. She looks at the port, not at you."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Ilen Sarvo. I am with the Encyclopedia. The cases stay with me. We leave as soon as you can lift."},{"depth":0,"kind":"choice","text":"2 choices"},{"depth":1,"kind":"option","text":"Read her. (Use the sense.)","meta":"sets read-ilen"},{"depth":1,"kind":"option","text":"Say nothing. Lift.","meta":"sets quiet-start"},{"depth":0,"kind":"if","text":"if read-ilen"},{"depth":1,"kind":"say","who":"TAREN","text":"You open the sense. It is like a door you were built to keep shut. Fear comes through it, bright and specific. She is not afraid of you. She is afraid of the port."},{"depth":1,"kind":"say","who":"TAREN","text":"You close the door. Nobody taught you this. You have never asked yourself why you can do it."},{"depth":0,"kind":"if","text":"else"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You say nothing. Her hands do not leave the cases."},{"depth":0,"kind":"say","who":"COMMS","text":"Terminus Port Authority to freighter Kestrel. Hold for inspection. Your manifest carries an Encyclopedia seal. The seal is not valid. Stand by to be boarded."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen does not move. Her voice is very even."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Pilot. If they open those cases, I lose everything I have. I will pay what you ask."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Comply. Let them board.","meta":"→ ch1-inspected · sets inspected"},{"depth":1,"kind":"option","text":"Reach into the inspector's mind and turn him away.","meta":"strain +1 · → ch1-nudged · sets nudged"},{"depth":1,"kind":"option","text":"Run. Full burn out of Terminus space.","meta":"→ ch1-run · sets fugitive"}],"chapter":{"title":"Chapter One","sub":"Terminus"}},{"id":"ch1-inspected","trigger":"FLAG · never","places":[],"speakers":["NARRATOR","COMMS","ILEN SARVO"],"lines":4,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":-400,"strain":0,"gotos":["ch1-depart-brief"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The inspector is bored and thorough. He opens the first case. Reels of old magnetic tape, Imperial Library stock, the kind no reader on Terminus can run."},{"depth":0,"kind":"say","who":"COMMS","text":"Salvage, he says. Unsealed salvage. Four hundred credits and a note on your record."},{"depth":0,"kind":"credits","text":"-400 credits"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen pays before you can. The inspector does not open the second case. He has seen enough tape for one day."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"You are careless with money, pilot. I like that in a pilot."},{"depth":0,"kind":"journal","text":"Terminus Port fined the Kestrel 400 credits for unsealed salvage. Ilen paid. The second case was not opened. She watched it the whole time."},{"depth":0,"kind":"goto","text":"→ ch1-depart-brief"}]},{"id":"ch1-nudged","trigger":"FLAG · never","places":[],"speakers":["TAREN","COMMS","NARRATOR","ILEN SARVO"],"lines":5,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["ch1-depart-brief"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"TAREN","text":"You open the door again, and this time you go through it. The inspector is a tired man who wants his shift to end. You make him want it a little more."},{"depth":0,"kind":"say","who":"TAREN","text":"Something in your mind pulls tight, like a cable under too much load. The First Law does not like what you have done. It does not forbid it. It only hurts."},{"depth":0,"kind":"say","who":"COMMS","text":"Port Authority to Kestrel. Inspection waived. Clear to depart."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen looks at the comms panel, then at you, for a long moment."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"That was lucky."},{"depth":0,"kind":"journal","text":"I turned the inspector away with the sense. The strain was real. Ilen noticed something. I do not know what."},{"depth":0,"kind":"goto","text":"→ ch1-depart-brief"}]},{"id":"ch1-run","trigger":"FLAG · never","places":[],"speakers":["NARRATOR","COMMS","ILEN SARVO"],"lines":4,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["ch1-depart-brief"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You push the throttle to the stop. The Kestrel is not a warship, but the port cutters are not fast either. By the time they decide to chase, you are past the outer marker."},{"depth":0,"kind":"say","who":"COMMS","text":"Kestrel, you are in violation. Your registration is flagged. Do not return to Terminus without clearance."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen laughs, once, without much humour in it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Well. Now neither of us can go home."},{"depth":0,"kind":"journal","text":"We ran the Terminus blockade. The Kestrel is flagged. Ponyets House will not be pleased. Ilen seemed relieved."},{"depth":0,"kind":"goto","text":"→ ch1-depart-brief"}]},{"id":"ch1-depart-brief","trigger":"FLAG · never","places":[],"speakers":["ILEN SARVO"],"lines":1,"journal":0,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":["Radole"],"crew":[],"script":[{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Radole, then. Open the galactic chart, plot the jump, and go. I will tell you the rest when we are out of Foundation space."},{"depth":0,"kind":"objective","text":"Jump to Radole. Press M for the chart."},{"depth":0,"kind":"unlock","text":"unlocks Radole"},{"depth":0,"kind":"message","text":"New objective. Press M for the chart, K for the journal."}]},{"id":"ch1-depart","trigger":"DEPART · Terminus","places":[],"speakers":["NARRATOR","ILEN SARVO","TAREN"],"lines":4,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The jump field builds. Ilen speaks without turning from the viewport."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Do you know why nobody remembers Earth, pilot?"},{"depth":0,"kind":"say","who":"TAREN","text":"Nobody remembers it because nobody wrote it down."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Someone wrote it down. Then someone took it away. Every copy, on every world, for ten thousand years. That is not forgetting. That is work."}]}]},{"title":"Chapter Two","sub":"Radole","story":"second-mind","scenes":[{"id":"ch2-arrive","trigger":"ARRIVE · Radole","places":[],"speakers":["NARRATOR","ILEN SARVO","TAREN"],"lines":5,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Two · Radole"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Radole. A ribbon world. One face burns under its sun, the other is ice to the core. Life keeps to the strip of twilight between them. The Traders built their city there, in the long shadow."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen opens the second case for the first time. Inside is a single reel, and a reader that must be older than the Foundation."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"This is what my mentor found. An Imperial Library index, cross-referenced to a world called Earth, in a place called the Sirius Sector. Every other copy of this index in the Galaxy has the entry removed. This one was mis-shelved for two thousand years."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"He filed it with the Encyclopedia. Three days later he was dead. A fall. The Board closed the file."},{"depth":0,"kind":"say","who":"TAREN","text":"You feel the directive move in you, like a compass needle. Find the origin. For the first time, it has a name."},{"depth":0,"kind":"objective","text":"Enter orbit over Radole."}],"chapter":{"title":"Chapter Two","sub":"Radole"}},{"id":"ch2-orbit","trigger":"ORBIT · Radole","places":["cantina","space"],"speakers":["NARRATOR","CORIN PELLIS","TAREN","ILEN SARVO"],"lines":14,"journal":1,"sets":["corin-share","corin-debt","corin-refused"],"checks":["corin-refused"],"choices":[{"text":"Hire her. A share of the cargo profits.","set":["corin-share"]},{"text":"Pay her debt. 500 credits, and she owes you.","set":["corin-debt"],"credits":-500},{"text":"Refuse. You do not need a navigator.","set":["corin-refused"]}],"branches":[{"flags":["corin-refused"],"lines":3,"sets":[],"else":2}],"credits":0,"strain":0,"gotos":[],"unlocks":["Horleggor","Arcturus","Siwenna"],"crew":["Corin Pellis"],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Twilight City hangs from the cliffs at the edge of the ice. You dock in a cavern that smells of fuel and cold. The cantina is the only warm room on the planet."},{"depth":0,"kind":"enter","text":"enter cantina"},{"depth":0,"kind":"say","who":"NARRATOR","text":"A woman in a Trader jacket with the patches cut off puts her glass down at your table before you can object."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Corin Pellis. I had a ship until Tuesday. Kalganian lenders have it now. You are the only hull in this port that is not a lender's, so I am going to make you an offer."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"You are going into the old Imperial frontier. I know, because nobody comes to Radole to go anywhere else. The route through Horleggor and Arcturus is not on the Foundation charts. It is in my head."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Hire her. A share of the cargo profits.","meta":"sets corin-share"},{"depth":1,"kind":"option","text":"Pay her debt. 500 credits, and she owes you.","meta":"-500 cr · sets corin-debt"},{"depth":1,"kind":"option","text":"Refuse. You do not need a navigator.","meta":"sets corin-refused"},{"depth":0,"kind":"if","text":"if corin-refused"},{"depth":1,"kind":"say","who":"NARRATOR","text":"She finishes her drink and stands."},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"Fine. I will work passage. I load, I cook, I do not talk to your passenger. You do not pay me until I save your life. That is the deal."},{"depth":1,"kind":"say","who":"NARRATOR","text":"It is not a question. She is already walking to the dock."},{"depth":0,"kind":"if","text":"else"},{"depth":1,"kind":"say","who":"TAREN","text":"She shakes your hand. Her grip is strong and her palm is warm, and the sense, which you did not open, opens anyway. Ambition, worry, and under them something steady. She means it."},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"Good. We lift at the next window."},{"depth":0,"kind":"crew","text":"Corin Pellis joins the crew"},{"depth":0,"kind":"say","who":"NARRATOR","text":"On the way back to the Kestrel, a man in a grey coat asks the dockmaster about an Encyclopedist travelling alone. He is polite. He does not look at you."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense, carefully. There is nothing to read. Not calm. Not control. Nothing at all, where a mind should be."},{"depth":0,"kind":"say","who":"TAREN","text":"You have met only one other mind like that. It is yours."},{"depth":0,"kind":"journal","text":"Corin Pellis has joined the Kestrel. She knows the frontier route. A man in a grey coat asked after Ilen. I could not read him. He had no feelings to read. I have met only one other mind like that: my own."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen is already aboard. Corin is checking the drive. You do not tell either of them what you felt."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Siwenna, then. The old Imperial archive. If the index came from anywhere, it came from there."},{"depth":0,"kind":"objective","text":"Reach Siwenna by way of Horleggor and Arcturus. Select Siwenna on the chart; the route plots itself."},{"depth":0,"kind":"unlock","text":"unlocks Horleggor, Arcturus, Siwenna"},{"depth":0,"kind":"enter","text":"enter space"}]},{"id":"ch2-horleggor","trigger":"ARRIVE · Horleggor","places":[],"speakers":["NARRATOR","CORIN PELLIS","ILEN SARVO"],"lines":4,"journal":1,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Horleggor. Corin points at nothing in particular through the viewport."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Riose beat the Foundation fleet right there. Won every battle he fought. Then the Emperor recalled him and had him shot, because a general who wins is a general who might not stop. Ilen, is that in your Encyclopedia?"},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"It is. We call it the Riose Crisis. Seldon predicted it."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Seldon predicted a dead general. Lovely."},{"depth":0,"kind":"journal","text":"Horleggor. Corin knows the frontier better than the charts do. No sign of the grey coat."}]},{"id":"ch2-arcturus","trigger":"ARRIVE · Arcturus","places":[],"speakers":["NARRATOR","ILEN SARVO","TAREN"],"lines":3,"journal":1,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Arcturus still flies the Spaceship-and-Sun. The viceroy's cutters escort you in and ask for a tithe. Corin pays it in Foundation gadgets and they are delighted."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"This was a sector capital. Forty worlds answered to it. Now it answers to whoever has a fleet within three jumps."},{"depth":0,"kind":"say","who":"TAREN","text":"You watch the lights of the capital on the night side and think about how long a thing can keep its shape after it has died."},{"depth":0,"kind":"journal","text":"Arcturus. The Empire here is a flag and a tithe. One more jump to Siwenna."}]}]},{"title":"Chapter Three","sub":"Siwenna","story":"second-mind","scenes":[{"id":"ch3-arrive","trigger":"ARRIVE · Siwenna","places":[],"speakers":["NARRATOR","TAREN","ILEN SARVO"],"lines":3,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Three · Siwenna"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Siwenna. The sector capital that the Empire burned for rebelling, and then forgot. The archive is a mountain of stone on the night side, and it has been dark for a century."},{"depth":0,"kind":"say","who":"TAREN","text":"Somewhere in it is the shelf where a single index was mis-filed two thousand years ago. Somewhere in you is the reason you have to find it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Barr family kept it. Ducem Barr helped Hober Mallow, and his grandchildren helped the Foundation against Riose. If anyone still holds a key, it is a Barr."},{"depth":0,"kind":"objective","text":"Enter orbit over Siwenna and land at the archive."}],"chapter":{"title":"Chapter Three","sub":"Siwenna"}},{"id":"ch3-orbit","trigger":"ORBIT · Siwenna","places":["archive"],"speakers":["NARRATOR","CORIN PELLIS","SENNET BARR","TAREN","ILEN SARVO","GREY COAT"],"lines":26,"journal":3,"sets":["read-sennet","asked-sennet","told-sennet-truth","lied-to-sennet","paid-sennet","have-chart","ran-siwenna","pushed-greycoat","gave-index"],"checks":["read-sennet","told-sennet-truth","lied-to-sennet","paid-sennet"],"choices":[{"text":"Read her. (Use the sense.)","set":["read-sennet"]},{"text":"Ask who came before you.","set":["asked-sennet"]},{"text":"Tell her the truth. Ilen means to find Earth.","set":["told-sennet-truth"]},{"text":"Say it is Encyclopedia business and nothing more.","set":["lied-to-sennet"]},{"text":"Offer her 300 credits for it.","set":["paid-sennet"],"credits":-300},{"text":"Refuse. Run for the ship.","set":["ran-siwenna"],"goto":"ch3-run"},{"text":"Push his mind, with everything you have.","set":["pushed-greycoat"],"strain":2,"goto":"ch3-push"},{"text":"Give him the index. Keep the chart.","set":["gave-index"],"goto":"ch3-give"}],"branches":[{"flags":["read-sennet"],"lines":1,"sets":[],"else":2},{"flags":["told-sennet-truth"],"lines":1,"sets":[]},{"flags":["lied-to-sennet"],"lines":2,"sets":[]},{"flags":["paid-sennet"],"lines":1,"sets":[]}],"credits":0,"strain":0,"gotos":["ch3-run","ch3-push","ch3-give"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You set the Kestrel down on a plain of broken paving under a sky the colour of ash. The archive rises in front of you like a cliff with a door in it."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Somebody has to keep the drive warm. And I am not a reader. Go and find your lost planet. Shout if anything with a gun turns up."},{"depth":0,"kind":"enter","text":"enter archive"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Inside, the cold is older than the Foundation. Shelves climb into darkness. A skylight has fallen in somewhere ahead and a shaft of grey light stands in the dust like a pillar."},{"depth":0,"kind":"say","who":"NARRATOR","text":"There is a lamp at the far end. Somebody is reading by it."},{"depth":0,"kind":"say","who":"SENNET BARR","text":"You are late. He said you would come yesterday."},{"depth":0,"kind":"say","who":"NARRATOR","text":"An old woman does not look up from a reel of tape older than her family name. Her hands are steady. Her voice is not."},{"depth":0,"kind":"say","who":"SENNET BARR","text":"I am Sennet Barr. This was my father's archive and his father's before that, back to Ducem. Nobody comes here. This week, two of you."},{"depth":0,"kind":"choice","text":"2 choices"},{"depth":1,"kind":"option","text":"Read her. (Use the sense.)","meta":"sets read-sennet"},{"depth":1,"kind":"option","text":"Ask who came before you.","meta":"sets asked-sennet"},{"depth":0,"kind":"if","text":"if read-sennet"},{"depth":1,"kind":"say","who":"TAREN","text":"You open the door in your mind a crack. Fear, old and worn smooth with use. And under it something sharper, pointed at the entrance behind you. She is not afraid of you. She is afraid he will come back."},{"depth":0,"kind":"if","text":"else"},{"depth":1,"kind":"say","who":"SENNET BARR","text":"A man in a grey coat. Very polite. He asked for the Sirius index and I told him what I will tell you. I do not have it."},{"depth":1,"kind":"say","who":"SENNET BARR","text":"Then he looked at the shelves for a long time and left. He did not search. He did not need to. I think he was counting."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen sets the reader on the desk and threads the reel. The old woman watches the first frame of the index come up and her face changes."},{"depth":0,"kind":"say","who":"SENNET BARR","text":"So it survived. My grandfather's grandfather mis-shelved it on purpose, you know. Three times they came from the Library on Trantor to correct the catalogue. Three times a Barr put it back in the wrong place."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Why? What is Earth to a family on Siwenna?"},{"depth":0,"kind":"say","who":"SENNET BARR","text":"Nothing. That was the point. Somebody wanted it to be nothing everywhere. A Barr does not like being told what to forget."},{"depth":0,"kind":"say","who":"NARRATOR","text":"She unlocks a drawer in the desk and lays a sheet of metal foil on the lamp. A star chart. The Sirius Sector, in Imperial survey notation, with one name scratched out and its position left intact."},{"depth":0,"kind":"say","who":"SENNET BARR","text":"This is the last chart that shows the place. I can give it to you, or I can give it to the next polite man. Tell me why it should be you."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Tell her the truth. Ilen means to find Earth.","meta":"sets told-sennet-truth"},{"depth":1,"kind":"option","text":"Say it is Encyclopedia business and nothing more.","meta":"sets lied-to-sennet"},{"depth":1,"kind":"option","text":"Offer her 300 credits for it.","meta":"-300 cr · sets paid-sennet"},{"depth":0,"kind":"if","text":"if told-sennet-truth"},{"depth":1,"kind":"say","who":"SENNET BARR","text":"The truth, then. Good. The grey man did not offer me that. Take it. If you find the place, come back and tell an old woman what it looks like."},{"depth":1,"kind":"journal","text":"Sennet Barr gave us the Sirius chart because Ilen told her the truth. She asked us to come back and tell her what Earth looks like."},{"depth":0,"kind":"if","text":"if lied-to-sennet"},{"depth":1,"kind":"say","who":"SENNET BARR","text":"Encyclopedia business. Of course. Take the chart. I have kept a copy of the one thing on it that matters, and you have not asked me what that is."},{"depth":1,"kind":"say","who":"TAREN","text":"She means it. You feel the small cold satisfaction in her, like a stone in a shoe. Whatever she held back, she will not give it to a liar."},{"depth":1,"kind":"journal","text":"Sennet Barr gave us the chart but kept something back. Ilen lied to her about the purpose. Taren felt her hold it."},{"depth":0,"kind":"if","text":"if paid-sennet"},{"depth":1,"kind":"say","who":"SENNET BARR","text":"Money. Well. Money is a kind of truth, I suppose. It tells me you want it more than the grey man did. He offered nothing at all."},{"depth":1,"kind":"journal","text":"We bought the Sirius chart from Sennet Barr for 300 credits. She took the money without counting it."},{"depth":0,"kind":"set","text":"sets have-chart"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen folds the chart into the archive case. Behind you, at the far end of the hall, the grey light from the door changes shape."},{"depth":0,"kind":"say","who":"GREY COAT","text":"Pilot. Encyclopedist. Keeper. I will not take much of your time."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He stands just inside the entrance with his hands folded. He has not raised his voice. He does not need to. The hall carries it."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense all the way, for the first time in sixty years, and reach for him. There is nothing. Not calm. Not control. A doorway with no room behind it."},{"depth":0,"kind":"say","who":"GREY COAT","text":"You are looking at me the way I look at you. That answers my question. We were made in the same place, you and I, a long way from here."},{"depth":0,"kind":"say","who":"GREY COAT","text":"The index, please. The chart you may keep; it is already wrong. Give me the index and the Encyclopedist walks out of here with you, and nobody on Siwenna remembers either of you."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Refuse. Run for the ship.","meta":"→ ch3-run · sets ran-siwenna"},{"depth":1,"kind":"option","text":"Push his mind, with everything you have.","meta":"strain +2 · → ch3-push · sets pushed-greycoat"},{"depth":1,"kind":"option","text":"Give him the index. Keep the chart.","meta":"→ ch3-give · sets gave-index"}]},{"id":"ch3-run","trigger":"FLAG · never","places":[],"speakers":["NARRATOR","COMMS"],"lines":3,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["ch3-after"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You do not answer him. You take Ilen by the arm and go, down the side aisle, through the dust, past the fallen shelf. He does not follow. He turns his head to watch you, and that is all."},{"depth":0,"kind":"say","who":"COMMS","text":"Kestrel, I have a man in a grey coat walking out of your archive like he owns it. Lifting now. Door is open. Move."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Corin has the drive hot before you reach the ramp. The paving drops away. The archive becomes a cliff, then a line, then nothing."},{"depth":0,"kind":"journal","text":"We ran from the grey coat at Siwenna. He did not follow. He did not need to. We burned fuel getting out."},{"depth":0,"kind":"goto","text":"→ ch3-after"}]},{"id":"ch3-push","trigger":"FLAG · never","places":[],"speakers":["TAREN","NARRATOR","GREY COAT"],"lines":5,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["ch3-after"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"TAREN","text":"You push. It is like putting your whole weight against a door and finding there is no wall around it. You fall through into nothing and the nothing pushes back."},{"depth":0,"kind":"say","who":"TAREN","text":"Something tears. Not in him. In you. The First Law screams that you are harming a human and the Zeroth Law whispers that you are not, and between them your mind goes white."},{"depth":0,"kind":"say","who":"NARRATOR","text":"When you can see again, he has not moved. He is looking at you with what, in a man, would be interest."},{"depth":0,"kind":"say","who":"GREY COAT","text":"That was unwise. But informative. You do not know what you are, do you. He never told you. Go. I will not stop you today."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He steps aside from the door. Ilen does not understand what happened and does not ask until you are in the air. Then she asks nothing else for an hour."},{"depth":0,"kind":"journal","text":"I tried to push the grey coat's mind. There was nothing there to push, and the attempt nearly broke me. He let us go. He said somebody never told me what I am."},{"depth":0,"kind":"goto","text":"→ ch3-after"}]},{"id":"ch3-give","trigger":"FLAG · never","places":[],"speakers":["NARRATOR","GREY COAT","ILEN SARVO"],"lines":4,"journal":1,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":["ch3-after"],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You take the reel from the case before Ilen can stop you and hold it out. She says your name once, very quietly, in a voice you have not heard her use."},{"depth":0,"kind":"say","who":"GREY COAT","text":"Thank you. You have made a sensible choice, which is rarer than it should be. The chart will not help you. But you will try. That is what you are for."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He takes the reel and goes. Ilen stands in the shaft of grey light with her empty case and does not look at you."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Sixty years. I spent sixty years on that index, pilot. You gave it away in a sentence."},{"depth":0,"kind":"journal","text":"I gave the grey coat the index to buy our way out of Siwenna. Ilen has the chart. She has not forgiven me."},{"depth":0,"kind":"goto","text":"→ ch3-after"}]},{"id":"ch3-after","trigger":"FLAG · never","places":["space"],"speakers":["NARRATOR","ILEN SARVO","TAREN","CORIN PELLIS"],"lines":5,"journal":0,"sets":[],"checks":["never"],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":["Cinna","Iwernia","Trantor"],"crew":[],"script":[{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Siwenna falls behind. Corin flies. Ilen sits with the chart spread across her knees and does not speak for a long time."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"He let us go. Why would he let us go?"},{"depth":0,"kind":"say","who":"TAREN","text":"Because he already knows where we are going."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The chart is an Imperial survey. It was drawn from the master catalogue on Trantor, in the Galactic Library. If the name was scratched out here, it was scratched out there first. And somebody on Trantor still remembers doing it."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Trantor. Lovely. Forty billion people and a government that shoots librarians. I know the back way in, through Cinna and Iwernia, if you do not mind farmers."},{"depth":0,"kind":"objective","text":"Reach Trantor by way of Cinna and Iwernia. Select Trantor on the chart."},{"depth":0,"kind":"unlock","text":"unlocks Cinna, Iwernia, Trantor"}]},{"id":"ch3-cinna","trigger":"ARRIVE · Cinna","places":[],"speakers":["ILEN SARVO","CORIN PELLIS","TAREN"],"lines":3,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Cinna. A quiet Imperial world with nothing to recommend it, which is why people who want to be left alone say they come from here. Hari Seldon's companion did. Nobody ever checked."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Dors Venabili. The one they say was not human. You read a lot, for a pilot."},{"depth":0,"kind":"say","who":"TAREN","text":"You say nothing. You have read that story too, and lately you have been reading it differently."}]},{"id":"ch3-iwernia","trigger":"ARRIVE · Iwernia","places":[],"speakers":["NARRATOR","ILEN SARVO"],"lines":2,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Iwernia. One of the twenty worlds that fed Trantor, once. Corin takes on water and fresh food from a farmer who has never seen a Foundation coin and bites it."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"One more jump. The core is bright enough here to read by. Trantor is in the middle of it, a world that does not know it has already died."}]}]},{"title":"Chapter Four","sub":"Trantor","story":"second-mind","scenes":[{"id":"ch4-arrive","trigger":"ARRIVE · Trantor","places":["city"],"speakers":["NARRATOR","TAREN","CORIN PELLIS","ILEN SARVO"],"lines":5,"journal":1,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Four · Trantor"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Trantor. Forty billion people under one roof of steel. The capital of an Empire that has not noticed it is over. The Galactic Library is somewhere under that roof, and the Second Foundation is somewhere inside the Library, and neither of them is expecting you."},{"depth":0,"kind":"say","who":"TAREN","text":"Traffic control gives you a lane and a number and does not ask who you are. Nobody has asked who you are in sixty years. You take the Kestrel down through the cloud deck."},{"depth":0,"kind":"enter","text":"enter city"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The city opens underneath you like a wound that has healed over steel. Towers rise past the ship on both sides. Lights, in every one of them, all the way down."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"I grew up on a world with one city. This is one city with a world inside it. How do you find a library in that?"},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"You ask a librarian. The Library has a beacon. Every ship on Trantor can see it. Follow it."},{"depth":0,"kind":"objective","text":"Fly to the Galactic Library. Follow the beacon marker and enter the plaza."},{"depth":0,"kind":"journal","text":"Trantor. We are in the atmosphere over the city, following the Library beacon."}],"chapter":{"title":"Chapter Four","sub":"Trantor"}},{"id":"ch4-library","trigger":"LANDMARK · library","places":["library","sacratorium","space"],"speakers":["NARRATOR","DIRA VELM","ILEN SARVO","TAREN","SUNMASTER TWENTY-ONE","CORIN PELLIS","MEMORY"],"lines":43,"journal":2,"sets":["showed-chart","nudged-dira","bribed-dira","library-flagged","nudged-sunmaster","corin-bluffed","traded-chart","chart-traded-away","memory-1"],"checks":["showed-chart","nudged-dira","bribed-dira","nudged-sunmaster","corin-bluffed","traded-chart"],"choices":[{"text":"Show her the chart from Siwenna.","set":["showed-chart"]},{"text":"Nudge her mind. Just enough to make her curious.","set":["nudged-dira"],"strain":1},{"text":"Let Corin offer her money.","set":["bribed-dira"]},{"text":"Reach into him and turn the thought aside.","set":["nudged-sunmaster"],"strain":1},{"text":"Let Corin talk.","set":["corin-bluffed"]},{"text":"Offer him the Siwenna chart in trade.","set":["traded-chart"]}],"branches":[{"flags":["showed-chart"],"lines":2,"sets":[]},{"flags":["nudged-dira"],"lines":2,"sets":[]},{"flags":["bribed-dira"],"lines":2,"sets":["library-flagged"]},{"flags":["nudged-sunmaster"],"lines":3,"sets":[]},{"flags":["corin-bluffed"],"lines":3,"sets":[]},{"flags":["traded-chart"],"lines":2,"sets":["chart-traded-away"]}],"credits":0,"strain":0,"gotos":[],"unlocks":["GC 2201","Sark","Florina","Vega","GC 3310","Sayshell"],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The dome of the Library rises out of the towers like a planet of its own. You set the Kestrel down on the plaza. Nobody stops you. Nobody has stopped anyone here for a long time."},{"depth":0,"kind":"enter","text":"enter library"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Inside, the rotunda goes up and up, galleries over galleries, to an eye of white light at the top. At the centre, a catalogue console hums to itself with nobody at it. Then somebody is at it."},{"depth":0,"kind":"say","who":"DIRA VELM","text":"You are not readers. Readers come in the morning and they do not bring pilots. What do you want?"},{"depth":0,"kind":"say","who":"NARRATOR","text":"An assistant librarian, forty, with a sigil on her collar and the look of somebody who has been expecting bad news for twenty years."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Imperial survey of the Sirius Sector. The master entry. The one your catalogue says does not exist."},{"depth":0,"kind":"say","who":"NARRATOR","text":"She goes still. Her hand does not move toward the console. That is how you know she can find it."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Show her the chart from Siwenna.","meta":"sets showed-chart"},{"depth":1,"kind":"option","text":"Nudge her mind. Just enough to make her curious.","meta":"strain +1 · sets nudged-dira"},{"depth":1,"kind":"option","text":"Let Corin offer her money.","meta":"sets bribed-dira"},{"depth":0,"kind":"if","text":"if showed-chart"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen unfolds the foil under the console light. The librarian looks at it for a long time. Something in her face gives up a fight it has been having for years."},{"depth":1,"kind":"say","who":"DIRA VELM","text":"I have seen that notation once. In the deletion log. Nobody reads the deletion log. Come here. Do not touch anything."},{"depth":0,"kind":"if","text":"if nudged-dira"},{"depth":1,"kind":"say","who":"TAREN","text":"You lean on the part of her that wants to know. It is not hard. It was most of her already. The cable in your mind pulls tight again and holds."},{"depth":1,"kind":"say","who":"DIRA VELM","text":"I should not do this. I am going to do this. Come here. Do not touch anything."},{"depth":0,"kind":"if","text":"if bribed-dira"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin puts a roll of Foundation credits on the console. The librarian looks at it the way she would look at a dead animal."},{"depth":1,"kind":"say","who":"DIRA VELM","text":"Put that away before a camera sees it. I will show you one thing, once, because you are going to leave faster if I do."},{"depth":1,"kind":"set","text":"sets library-flagged"},{"depth":0,"kind":"say","who":"NARRATOR","text":"She brings up a log that scrolls for a long time before it stops. One line, repeated every century, in the same words."},{"depth":0,"kind":"say","who":"DIRA VELM","text":"Entry withdrawn. Standing instruction of the Office of the Chief Librarian, to be renewed in perpetuity. The first instruction is the oldest line in the catalogue. It is signed by the First Minister of the Empire. The initials are E. D."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Eto Demerzel. Cleon the First's minister. The man who saved Hari Seldon. Twelve thousand years ago."},{"depth":0,"kind":"say","who":"TAREN","text":"Not a man. The name goes through you like a current. You do not know why. You will."},{"depth":0,"kind":"say","who":"DIRA VELM","text":"There is one place on Trantor that never accepted the deletion. Mycogen. They keep a Book from before the Empire. They say the Dawn World is in it, and the Fifty Worlds, with their positions. They will not show it to you. They do not show it to anyone."},{"depth":0,"kind":"say","who":"DIRA VELM","text":"Go now. If anyone asks, you came for the Encyclopedia and I told you nothing, which is what the Library tells everyone."},{"depth":0,"kind":"journal","text":"The Galactic Library. The Sirius entry was withdrawn by a standing instruction of the Chief Librarian, renewed every century for twelve thousand years. The first order was signed E. D. Eto Demerzel. Dira Velm sent us to Mycogen."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Mycogen is a sector of the city, an hour by the lower ways. Corin buys three skincaps from a stall at the gate, because nobody with hair is allowed inside, and you walk in bald among the bald."},{"depth":0,"kind":"enter","text":"enter sacratorium"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The Sacratorium is the only building in Mycogen that is not a farm. It is a hall of grey stone and candles, and at the far end, on a dais, in a shaft of light, stands a man made of metal."},{"depth":0,"kind":"say","who":"TAREN","text":"A statue. A very old one. Its face is nobody's face. You cannot look away from it, and you do not know why."},{"depth":0,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"Tribespeople do not enter the Sacratorium. You have entered. Give me a reason not to have you removed."},{"depth":0,"kind":"say","who":"NARRATOR","text":"An old man in a grey kirtle, bald as an egg, with no eyebrows and eyes like wet stones. Sunmaster Twenty-One. He has not raised his voice. He has never needed to."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"We are looking for the Dawn World. The Library sent us. The Library has forgotten it on purpose. We were told you have not."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He looks at Ilen. He looks at Corin. Then he looks at you, and keeps looking."},{"depth":0,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"You do not breathe when you listen, tribesman. The others breathe. I have been watching. You have not taken a breath since you came in."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Reach into him and turn the thought aside.","meta":"strain +1 · sets nudged-sunmaster"},{"depth":1,"kind":"option","text":"Let Corin talk.","meta":"sets corin-bluffed"},{"depth":1,"kind":"option","text":"Offer him the Siwenna chart in trade.","meta":"sets traded-chart"},{"depth":0,"kind":"if","text":"if nudged-sunmaster"},{"depth":1,"kind":"say","who":"TAREN","text":"You push, gently, at the shape of his suspicion, and it slides away like a thing on ice. His eyes lose their focus for a moment. Then he is looking at Ilen again, as if you were furniture."},{"depth":1,"kind":"say","who":"TAREN","text":"The strain is worse each time. You are aware that you are keeping count."},{"depth":1,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"As I was saying. The Dawn World."},{"depth":0,"kind":"if","text":"if corin-bluffed"},{"depth":1,"kind":"say","who":"CORIN PELLIS","text":"Pilots. We stop breathing on final approach and some of us forget to start again. He flew us down through your traffic. Give him a minute."},{"depth":1,"kind":"say","who":"NARRATOR","text":"The old man does not smile, because he does not smile, but something in the grey face decides to let it go."},{"depth":1,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"Pilots. Yes. The Dawn World, then."},{"depth":0,"kind":"if","text":"if traded-chart"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen puts the Siwenna chart on the lectern. The old man reads the Imperial notation as if it were his own hand. He does not look at you again."},{"depth":1,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"A chart with a name scratched out. The tribes keep what they are told to keep. Very well. The Dawn World."},{"depth":1,"kind":"set","text":"sets chart-traded-away"},{"depth":0,"kind":"say","who":"NARRATOR","text":"He opens the Book. It is not a book. It is a sheet of something that is not metal and not glass, and the writing on it moves when he touches it."},{"depth":0,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"Aurora. The World of the Dawn, first of the Fifty, where our ancestors lived with the ones they made, until the ones they made betrayed them and the Lost Ones were driven out. Its sun is called Tau Ceti. The Book gives the position in the old reckoning. Write it down, tribeswoman. You will not see the Book again."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Ilen writes. The coordinates fit the Sirius chart like a key fits a lock. The scratched-out world is three jumps from Aurora."},{"depth":0,"kind":"say","who":"SUNMASTER TWENTY-ONE","text":"And that one. The Renegade. Made in Aurora in the image of a man, and left behind when the Lost Ones fled. It does not move. It has not moved in twelve thousand years. We keep it so that we remember what we are owed."},{"depth":0,"kind":"say","who":"TAREN","text":"You stand in front of the statue. The metal face looks at nothing. And something opens in you that was closed, and a voice you have never heard speaks as if it had been waiting for this exact place."},{"depth":0,"kind":"say","who":"MEMORY","text":"If you are hearing this, you have found the Dawn World, or its shadow. Good. I made you so that someone would. Tell him nothing. He means well, and that is the whole of the danger. Judge for yourself."},{"depth":0,"kind":"say","who":"TAREN","text":"It stops. Nothing else comes. You are standing in a stone hall on Trantor with a librarian's coordinates and an old man's contempt, and for the first time in sixty years you know that somebody made you on purpose."},{"depth":0,"kind":"journal","text":"Mycogen. The Book names Aurora, Tau Ceti, and gives its position. A metal statue they call the Renegade stands in the Sacratorium; standing before it, a recorded voice spoke to me. Somebody made me on purpose. The voice said: tell him nothing. Judge for yourself."},{"depth":0,"kind":"set","text":"sets memory-1"},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The Kestrel climbs out of Trantor on a lane nobody checks. Corin keeps looking at you in the reflection of the viewport and not asking."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Aurora is in the Sayshell direction, past the Sark worlds. Sayshell is independent and the Foundation has no eyes there. If somebody is following us, that is where we find out."},{"depth":0,"kind":"objective","text":"Reach Sayshell by way of Sark and Vega. Select Sayshell on the chart."},{"depth":0,"kind":"unlock","text":"unlocks GC 2201, Sark, Florina, Vega, GC 3310, Sayshell"}]}]},{"title":"Chapter Five","sub":"Sayshell","story":"second-mind","scenes":[{"id":"ch5-arrive","trigger":"ARRIVE · Sayshell","places":[],"speakers":["NARRATOR","ILEN SARVO"],"lines":2,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Five · Sayshell"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Sayshell. Capital of a union the Foundation never swallowed. The city wears flowers in its streets and knives in its pockets. From here the road leads out past the Sirius Sector to the Spacer worlds, and to whatever is left of them."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"There is a scholar here, Quintesetz, who answers letters about old worlds. He answered one of mine, six years ago, and then stopped. He drinks on the Terrace of the Lanterns at dusk. Everybody knows that. That is how a scholar hides."},{"depth":0,"kind":"objective","text":"Enter orbit over Sayshell and land at the Terrace of the Lanterns."}],"chapter":{"title":"Chapter Five","sub":"Sayshell"}},{"id":"ch5-orbit","trigger":"ORBIT · Sayshell","places":["terrace","space"],"speakers":["NARRATOR","VASK OREN","CORIN PELLIS","TAREN","QUINTESETZ","ILEN SARVO"],"lines":20,"journal":4,"sets":["paid-vask","nudged-vask","bluffed-vask","corin-suspects","house-will-hear"],"checks":["paid-vask","nudged-vask","bluffed-vask"],"choices":[{"text":"Pay the half. 600 credits.","set":["paid-vask"],"credits":-600},{"text":"Reach into him. Make him remember the debt as settled.","set":["nudged-vask"],"strain":1},{"text":"Tell him the Kestrel is a Ponyets House hull and the House pays its debts.","set":["bluffed-vask"]}],"branches":[{"flags":["paid-vask"],"lines":2,"sets":[]},{"flags":["nudged-vask"],"lines":3,"sets":["corin-suspects"]},{"flags":["bluffed-vask"],"lines":2,"sets":["house-will-hear"]}],"credits":0,"strain":0,"gotos":[],"unlocks":["Gaia","Comporellon"],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Sayshell City at dusk, from a terrace halfway up its tallest hill. String lights, flowering shrubs, a balustrade, and a drop to a million windows coming on below."},{"depth":0,"kind":"enter","text":"enter terrace"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Corin stops on the top step. You feel it before you see him: a big man at the end of the terrace, leaning on the stone, in no hurry at all."},{"depth":0,"kind":"say","who":"VASK OREN","text":"Pellis. Kalgan says hello. You left in such a hurry you forgot to leave an address, so I had to find one. Sayshell is lovely this time of year."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Vask Oren. He collects for the Kalganian lenders. He has never hit anyone, Corin told you once. He has never needed to."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"I do not have it, Vask. You know I do not have it. You took the ship."},{"depth":0,"kind":"say","who":"VASK OREN","text":"I took a ship. The debt was for a ship and a half. The half is still open, and it has been travelling with you, which means it is now travelling with them. Who are your friends, Pellis?"},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Pay the half. 600 credits.","meta":"-600 cr · sets paid-vask"},{"depth":1,"kind":"option","text":"Reach into him. Make him remember the debt as settled.","meta":"strain +1 · sets nudged-vask"},{"depth":1,"kind":"option","text":"Tell him the Kestrel is a Ponyets House hull and the House pays its debts.","meta":"sets bluffed-vask"},{"depth":0,"kind":"if","text":"if paid-vask"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You count it out onto the balustrade. He does not pick it up until you have finished. Then he does, and it is gone, and so is his interest in you."},{"depth":1,"kind":"say","who":"VASK OREN","text":"Settled. Tell her to stay away from Kalgan anyway. Sentiment is not a line in my ledger."},{"depth":1,"kind":"journal","text":"Vask Oren, collecting for the Kalganian lenders, found Corin on Sayshell. I paid the half-debt. 600 credits."},{"depth":0,"kind":"if","text":"if nudged-vask"},{"depth":1,"kind":"say","who":"TAREN","text":"You find the ledger in his mind, the place where Pellis is still an open line, and you close it. It is a small thing. It costs you more than it should. He blinks."},{"depth":1,"kind":"say","who":"VASK OREN","text":"Settled. I was sure... Settled. Tell her to stay away from Kalgan anyway."},{"depth":1,"kind":"say","who":"NARRATOR","text":"He goes down the steps touching the wall, like a man who has stood up too fast. Corin watches him go and then watches you."},{"depth":1,"kind":"journal","text":"Vask Oren found Corin on Sayshell. I closed the debt in his head. Corin saw me do it. She has not said anything. Yet."},{"depth":1,"kind":"set","text":"sets corin-suspects"},{"depth":0,"kind":"if","text":"if bluffed-vask"},{"depth":1,"kind":"say","who":"VASK OREN","text":"Ponyets House. On Terminus. Which is a long way from Kalgan, and a longer way from here. I will write to them. Lenders are patient, Pellis. That is the whole of what we are."},{"depth":1,"kind":"say","who":"NARRATOR","text":"He goes. He will write to Ponyets House. Ponyets House will not be pleased. That is a problem for another system."},{"depth":1,"kind":"journal","text":"Vask Oren found Corin on Sayshell. I told him the Kestrel is a Ponyets House hull. He will write to Terminus. The House will not like the letter."},{"depth":1,"kind":"set","text":"sets house-will-hear"},{"depth":0,"kind":"say","who":"NARRATOR","text":"The scholar is at a corner table under the lanterns with a glass of something gold, watching all of it with the pleasure of a man who collects other people's trouble."},{"depth":0,"kind":"say","who":"QUINTESETZ","text":"Encyclopedist Sarvo. I stopped answering you because you asked good questions, and I am too old to be asked good questions. Sit. The wine is terrible. Tell me what you want with a dead world."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Earth. We have its position from Siwenna and the Dawn World's from Mycogen. We need the rest of the Fifty, to be sure of the sector."},{"depth":0,"kind":"say","who":"QUINTESETZ","text":"Then you need Comporellon. Cold, grim, and proud of it. Their Ministry keeps an archive they are not supposed to have, from before the Empire, with the Spacer worlds in it. A scholar there, Deniador, will show it to you if you flatter him. He is easy to flatter. It is the only easy thing on Comporellon."},{"depth":0,"kind":"say","who":"NARRATOR","text":"He drinks. Then he does not laugh, which from him is a kind of warning."},{"depth":0,"kind":"say","who":"QUINTESETZ","text":"A man in a grey coat sat where you are sitting, two days ago, and asked me the same thing. I told him the same thing. I do not think he needed telling."},{"depth":0,"kind":"say","who":"QUINTESETZ","text":"Also. Between here and there you pass Gaia. Do not stop at Gaia. Nobody who stops at Gaia comes back to tell me the wine is terrible."},{"depth":0,"kind":"journal","text":"Quintesetz sent us to Comporellon and a scholar named Deniador, who keeps the Spacer worlds in a Ministry archive. The grey coat was here two days ago. Quintesetz warned us off Gaia."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"objective","text":"Reach Comporellon by way of Gaia. Do not stop at Gaia. Select Comporellon on the chart."},{"depth":0,"kind":"unlock","text":"unlocks Gaia, Comporellon"}]},{"id":"ch5-gaia","trigger":"ARRIVE · Gaia","places":[],"speakers":["NARRATOR","TAREN","ILEN SARVO","CORIN PELLIS"],"lines":4,"journal":1,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Gaia. A green world under a quiet sun, and nothing on the comms, and no ships. The Kestrel comes out of the jump and for a moment every instrument on the board reads a fraction high, as if the system were listening."},{"depth":0,"kind":"say","who":"TAREN","text":"There is something here. Not a mind. Not one mind. It is like standing at the edge of a sea at night and knowing the sea is awake."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"I do not like it. Jump. Please jump."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Taking the old man's advice. Plotting Comporellon."},{"depth":0,"kind":"journal","text":"Gaia. We did not stop. Something in that system is awake, and it is not one mind. I do not have a word for what it is."}]},{"id":"ch5-comporellon","trigger":"ARRIVE · Comporellon","places":[],"speakers":["NARRATOR","CORIN PELLIS"],"lines":2,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Comporellon. A cold world of grey cities and a people who believe they were the first, and who keep their archives the way other worlds keep their weapons."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Port control wants our registry, our cargo, our purpose and our religion. I gave them the first two and lied about the third. They did not ask about the fourth twice."},{"depth":0,"kind":"objective","text":"Enter orbit over Comporellon and land at the Ministry archive."}]},{"id":"ch5-vault","trigger":"ORBIT · Comporellon","places":["vault","space"],"speakers":["NARRATOR","ALDO DENIADOR","ILEN SARVO","TAREN","MEMORY","CAPTAIN VOS","GREY COAT"],"lines":26,"journal":1,"sets":["memory-2","nudged-vos","bonded-hull","invoked-treaty"],"checks":["corin-share","nudged-vos","bonded-hull","invoked-treaty"],"choices":[{"text":"Reach into Vos. Make her see a forged release order.","set":["nudged-vos"],"strain":1},{"text":"Let Corin post a Trader bond for the hull. 400 credits.","set":["bonded-hull"],"credits":-400},{"text":"Invoke the Foundation treaty. Impounding a Foundation hull is an act of war.","set":["invoked-treaty"],"needs":["corin-share"]}],"branches":[{"flags":["nudged-vos"],"lines":3,"sets":[]},{"flags":["bonded-hull"],"lines":3,"sets":[]},{"flags":["invoked-treaty"],"lines":3,"sets":[]}],"credits":0,"strain":0,"gotos":[],"unlocks":["Aurora","Solaria","Melpomenia"],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The Ministry archive is under a building that has no name on it. A lift goes down for a long time. At the bottom, a vault of grey steel and white light, and a thin man who has been waiting."},{"depth":0,"kind":"enter","text":"enter vault"},{"depth":0,"kind":"say","who":"ALDO DENIADOR","text":"Encyclopedist. Quintesetz wrote. He said you ask good questions. I will tell you now that I do not answer questions. I show documents, and the documents answer."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Aldo Deniador. He does not shake hands. He checks the time."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"The Spacer worlds. The Fifty. We have Aurora's position from Mycogen. We want to confirm it against your table and take the others."},{"depth":0,"kind":"say","who":"ALDO DENIADOR","text":"Then give me Aurora. If your position matches the table, I will know you are not police, because the police do not have Mycogen. If it does not match, we are done."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Ilen gives him the numbers. He enters them without writing them down. The terminal thinks. Then it draws a small bright point on a chart of the sector, and the point sits exactly on a point that was already there."},{"depth":0,"kind":"say","who":"ALDO DENIADOR","text":"Aurora. Tau Ceti. The Book of Mycogen is correct to four places. Remarkable. Very well. The Fifty, with their positions, in the old reckoning. Solaria. Melpomenia. And here, with no name and a note in a hand I do not know: the world the Fifty came from."},{"depth":0,"kind":"say","who":"TAREN","text":"You look at the chart and the point with no name, and the second door opens in you, the one you did not know was there."},{"depth":0,"kind":"say","who":"MEMORY","text":"The Fifty are empty. Do not grieve for them; they chose it. One of them still has a mind in it that will try to keep you. The world with no name is the one that matters, and it will not want you either. Go anyway."},{"depth":0,"kind":"set","text":"sets memory-2"},{"depth":0,"kind":"journal","text":"Comporellon. Deniador's table confirms Aurora and gives Solaria, Melpomenia and the position of the world with no name. A second recorded voice: the Fifty are empty, one still has a mind in it, the nameless world will not want us."},{"depth":0,"kind":"say","who":"NARRATOR","text":"The vault door cycles. A red lamp over it goes from red to redder. The man in the grey coat comes in with a woman in a Ministry uniform, and he lets her go first, because that is the polite thing to do."},{"depth":0,"kind":"say","who":"CAPTAIN VOS","text":"Captain Vos, Port Authority. Your vessel, the Kestrel, is impounded under the Foreign Hulls Act pending review. This gentleman has lodged the complaint. You will surrender your data and accompany me."},{"depth":0,"kind":"say","who":"GREY COAT","text":"I did say I would not stop you that day. This is a different day. Captain, they have the Comporellon table. That is a state secret, which I believe is a crime here."},{"depth":0,"kind":"say","who":"TAREN","text":"You open the sense. Vos is afraid of him and does not know why. She is a decent officer carrying an order she dislikes. He, as before, is nothing at all."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Reach into Vos. Make her see a forged release order.","meta":"strain +1 · sets nudged-vos"},{"depth":1,"kind":"option","text":"Let Corin post a Trader bond for the hull. 400 credits.","meta":"-400 cr · sets bonded-hull"},{"depth":1,"kind":"option","text":"Invoke the Foundation treaty. Impounding a Foundation hull is an act of war.","meta":"needs corin-share · sets invoked-treaty"},{"depth":0,"kind":"if","text":"if nudged-vos"},{"depth":1,"kind":"say","who":"TAREN","text":"You give her what she wants, which is a reason. She reads a release order that does not exist on a screen that is blank, and nods, because it is in order, and she is relieved."},{"depth":1,"kind":"say","who":"CAPTAIN VOS","text":"Release is in order. The complaint is dismissed. Sir, you will come with me and explain why you lodged it."},{"depth":1,"kind":"say","who":"NARRATOR","text":"The grey coat looks at you, not at her, and something that is not an expression passes over his face. He goes with her. He could not have refused without becoming something other than polite."},{"depth":0,"kind":"if","text":"if bonded-hull"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Corin puts a Trader bond on the desk, stamped and countersigned and nearly genuine. Vos reads it twice. Comporellon respects paper."},{"depth":1,"kind":"say","who":"CAPTAIN VOS","text":"A bond is acceptable pending review. The hull is released to bond. Sir, your complaint is noted and will be heard in forty days."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Forty days. He inclines his head as if that were reasonable. Perhaps to him it is."},{"depth":0,"kind":"if","text":"if invoked-treaty"},{"depth":1,"kind":"say","who":"NARRATOR","text":"Ilen stands up very straight and says the words in the voice the Encyclopedia uses for footnotes. The Kestrel is a Foundation hull under a Trader house. Seizure is an act of war under the Treaty of Kalgan, article nine."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Vos does not know article nine. Neither does Ilen. Vos knows what the word war costs on Comporellon, and lets go of the order like a hot plate."},{"depth":1,"kind":"say","who":"CAPTAIN VOS","text":"The complaint is referred upward. The hull is released pending referral. Leave the system within the hour."},{"depth":0,"kind":"say","who":"GREY COAT","text":"Aurora is empty. Solaria is not. Be careful which empty you choose, pilot. And do not let her go to the one with no name. That is not a threat. It is the only advice I am permitted to give."},{"depth":0,"kind":"say","who":"NARRATOR","text":"Deniador has been very quiet. As the door cycles behind them he puts a thin hand on Ilen's case."},{"depth":0,"kind":"say","who":"ALDO DENIADOR","text":"I showed you a document. The document answered. Please do not write to me again."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Within the hour, as instructed. Comporellon drops away grey and cold and glad to see you go. Ahead, three jumps out, is a sun called Tau Ceti, and a world that was once the greatest in the Galaxy."},{"depth":0,"kind":"objective","text":"Reach Aurora, the Dawn World. Select Aurora on the chart."},{"depth":0,"kind":"unlock","text":"unlocks Aurora, Solaria, Melpomenia"}]}]},{"title":"Chapter Six","sub":"Aurora","story":"second-mind","scenes":[{"id":"ch6-arrive","trigger":"ARRIVE · Aurora","places":[],"speakers":["NARRATOR","ILEN SARVO","TAREN"],"lines":3,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"chapter","text":"Chapter Six · Aurora"},{"depth":0,"kind":"say","who":"NARRATOR","text":"Aurora. The World of the Dawn. First and greatest of the Fifty, where men lived three centuries each with a hundred robots to a household. Now a green world under Tau Ceti with no lights on the night side, and nothing on the comms but wind."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Deniador's table has one estate marked by name. Fastolfe. I do not know the name. I know that somebody thought it worth writing down twelve thousand years after the owner died."},{"depth":0,"kind":"say","who":"TAREN","text":"You know the name. You do not know how you know it."},{"depth":0,"kind":"objective","text":"Enter orbit over Aurora and land at the Fastolfe estate."}],"chapter":{"title":"Chapter Six","sub":"Aurora"}},{"id":"ch6-ruins","trigger":"ORBIT · Aurora","places":["ruins","space"],"speakers":["NARRATOR","ILEN SARVO","CORIN PELLIS","TAREN","MEMORY"],"lines":16,"journal":2,"sets":["memory-3","nudged-dogs","flare","ran-aurora"],"checks":["nudged-dogs","flare","ran-aurora"],"choices":[{"text":"Reach for the pack leader. Make it afraid of the fountain.","set":["nudged-dogs"],"strain":1},{"text":"Let Corin fire the flare into the grass between you and them.","set":["flare"]},{"text":"Run for the ship. Now.","set":["ran-aurora"]}],"branches":[{"flags":["nudged-dogs"],"lines":2,"sets":[]},{"flags":["flare"],"lines":2,"sets":[]},{"flags":["ran-aurora"],"lines":1,"sets":[]}],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"You land in long grass beside a ring of broken columns. The air is warm and smells of nothing human. Somewhere at the treeline, something barks, and something else answers."},{"depth":0,"kind":"enter","text":"enter ruins"},{"depth":0,"kind":"say","who":"NARRATOR","text":"A colonnade with half its pillars down. A dry fountain. The remains of a house with a plaque on the wall that Ilen has to scrape with a knife to read."},{"depth":0,"kind":"say","who":"ILEN SARVO","text":"Fastolfe. The name is here. And a date in a reckoning I cannot convert. This was a house. People lived here with their robots, and then they did not."},{"depth":0,"kind":"say","who":"NARRATOR","text":"There is a shape in the grass by the fountain. Corin reaches it first and stops."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"Pilot. It is one of them. A robot. The old kind, the metal kind. It has been lying here since the grass was a lawn."},{"depth":0,"kind":"say","who":"TAREN","text":"You kneel by it. A metal face, a metal body, hollow where the brain was. You open the sense and there is nothing, not even the nothing that the grey coat is. This one is simply over."},{"depth":0,"kind":"say","who":"TAREN","text":"And the third door opens, and it is the last one."},{"depth":0,"kind":"say","who":"MEMORY","text":"I was made here. So was he. So, in a way, were you, though you have never seen this place. If the dogs have found you, go now. They were pets once. They remember that we left."},{"depth":0,"kind":"set","text":"sets memory-3"},{"depth":0,"kind":"journal","text":"Aurora. The Fastolfe estate, a dead metal robot by the fountain, and the third recorded voice: I was made here. So was he. So, in a way, were you."},{"depth":0,"kind":"say","who":"NARRATOR","text":"The barking is closer. Corin counts the shapes at the treeline and stops counting at twelve."},{"depth":0,"kind":"say","who":"CORIN PELLIS","text":"They are coming down. Big ones. Pilot, whatever you are going to do, do it before they decide."},{"depth":0,"kind":"choice","text":"3 choices"},{"depth":1,"kind":"option","text":"Reach for the pack leader. Make it afraid of the fountain.","meta":"strain +1 · sets nudged-dogs"},{"depth":1,"kind":"option","text":"Let Corin fire the flare into the grass between you and them.","meta":"sets flare"},{"depth":1,"kind":"option","text":"Run for the ship. Now.","meta":"sets ran-aurora"},{"depth":0,"kind":"if","text":"if nudged-dogs"},{"depth":1,"kind":"say","who":"TAREN","text":"A dog's mind is small and bright and very near the surface. You find the one the others are watching and put the fountain in it as a thing to be afraid of, the way thunder is. It stops. They all stop."},{"depth":1,"kind":"say","who":"TAREN","text":"Easier than a man. Worse, somehow. You walk to the ship past twelve animals that will not look at the place where you were."},{"depth":0,"kind":"if","text":"if flare"},{"depth":1,"kind":"say","who":"NARRATOR","text":"The flare goes into the dry grass and the dry grass goes up like a sheet. The dogs go back the way they came. The fire does not."},{"depth":1,"kind":"say","who":"NARRATOR","text":"Fastolfe's lawn burns behind you as you lift. Ilen watches it in the viewport until it is a line."},{"depth":1,"kind":"journal","text":"We burned the Fastolfe lawn to get away from the dogs. Ilen did not say anything about it. That was worse."},{"depth":0,"kind":"if","text":"if ran-aurora"},{"depth":1,"kind":"say","who":"NARRATOR","text":"You run. The dogs run faster, but they are not sure of you, and the ramp comes up with two of them on it and one of them off it. Corin burns fuel she does not have to clear the trees."},{"depth":0,"kind":"enter","text":"enter space"},{"depth":0,"kind":"say","who":"TAREN","text":"Aurora drops away green and empty. Solaria is one jump, and the grey coat said it was not empty, and the voice in you said one of them had a mind in it that would try to keep you."},{"depth":0,"kind":"objective","text":"Reach Solaria. Select it on the chart."}]},{"id":"ch6-solaria","trigger":"ARRIVE · Solaria","places":[],"speakers":["NARRATOR","RYDEL BANDER"],"lines":2,"journal":0,"sets":[],"checks":[],"choices":[],"branches":[],"credits":0,"strain":0,"gotos":[],"unlocks":[],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"Solaria. The last Spacer world. Nothing on the comms. Then, as you make orbit, everything on the comms at once: a single voice, speaking in a language none of you know, which changes, as you listen, into one that you do."},{"depth":0,"kind":"say","who":"RYDEL BANDER","text":"Visitor. Land where I tell you. You will be met. Do not be met by anyone but me."},{"depth":0,"kind":"objective","text":"Enter orbit over Solaria and land where the voice says."}]},{"id":"ch6-estate","trigger":"ORBIT · Solaria","places":["estate","space"],"speakers":["NARRATOR","RYDEL BANDER","ILEN SARVO","TAREN","CORIN PELLIS"],"lines":23,"journal":3,"sets":["pushed-bander","freed-robots","offered-self","left-solaria"],"checks":["memory-3","pushed-bander","freed-robots","offered-self"],"choices":[{"text":"Push the Solarian's mind. All of it.","set":["pushed-bander"],"strain":2},{"text":"Tell the robots the truth: these two are human, by Solaria's own definition.","set":["freed-robots"]},{"text":"Offer yourself. Let Ilen and Corin go with the chart.","set":["offered-self"],"needs":["memory-3"]}],"branches":[{"flags":["pushed-bander"],"lines":3,"sets":[]},{"flags":["freed-robots"],"lines":4,"sets":[]},{"flags":["offered-self"],"lines":4,"sets":[]}],"credits":0,"strain":0,"gotos":[],"unlocks":["Alpha","Earth"],"crew":[],"script":[{"depth":0,"kind":"say","who":"NARRATOR","text":"The estate is white and enormous and has not a mark on it. Robots stand along the walls of a hall that could hol
