  if (!k.story.main && k === cards.get(k.story.rows[0].scenes[0].id)) for (const f of req) for (const s of setters.get(f) ?? []) link(s, k, 'flag', 'contract needs ' + f);
}

// ---- pan and zoom
let scale = 1, tx = 0, ty = 0;
function apply() { world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
function fit() { const r = board.getBoundingClientRect(); scale = Math.min(1, (r.width - 32) / worldW); scale = Math.max(scale, 0.08); tx = 16; ty = 16; apply(); }
function home() { scale = Math.min(1, Math.max(0.6, (board.getBoundingClientRect().width - 32) / (LABEL_W + 3 * (CARD_W + GAP_X)))); tx = 16; ty = 16; apply(); }
function zoomAt(f, cx, cy) { const ns = Math.min(3, Math.max(0.08, scale * f)); tx = cx - (cx - tx) * (ns / scale); ty = cy - (cy - ty) * (ns / scale); scale = ns; apply(); }
board.addEventListener('wheel', (e) => { e.preventDefault(); const r = board.getBoundingClientRect(); if (e.ctrlKey || !e.deltaX) zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); else { tx -= e.deltaX; ty -= e.deltaY; apply(); } }, { passive: false });
const pointers = new Map(); let lastDist = 0, moved = false;
board.addEventListener('pointerdown', (e) => { if (e.target.closest('#drawer, button, input')) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); board.setPointerCapture(e.pointerId); board.classList.add('dragging'); moved = false; });
board.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId); pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) { tx += e.clientX - prev.x; ty += e.clientY - prev.y; if (Math.abs(e.clientX - prev.x) + Math.abs(e.clientY - prev.y) > 1) moved = true; apply(); }
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const r = board.getBoundingClientRect(); if (lastDist) zoomAt(d / lastDist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); lastDist = d; moved = true; }
});
const up = (e) => { pointers.delete(e.pointerId); if (!pointers.size) { board.classList.remove('dragging'); lastDist = 0; } };
board.addEventListener('pointerup', up); board.addEventListener('pointercancel', up);
cardsEl.addEventListener('click', (e) => { if (moved) e.stopPropagation(); }, true);
document.getElementById('fit').addEventListener('click', fit);
document.getElementById('zin').addEventListener('click', () => { const r = board.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); });
document.getElementById('zout').addEventListener('click', () => { const r = board.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); });
window.addEventListener('resize', () => { /* keep the view; the board is infinite */ });

// ---- selection and the script drawer
let activeId = null;
function select(id) {
  if (moved) return;
  activeId = id;
  for (const k of cards.values()) k.el.classList.toggle('active', k.card.id === id);
  for (const e of edges) e.p.classList.toggle('hot', e.a === id || e.b === id);
  const k = cards.get(id); const c = k.card;
  let h = `<button class="close" type="button" id="close">Close</button><h2>${esc(c.id)}</h2><div class="sub">${esc(k.story.title)} · ${esc(c.trigger)}</div>`;
  for (const l of c.script) {
    const cls = l.kind === 'say' ? (l.who === 'NARRATOR' ? 'narr' : 'say') : l.kind === 'option' ? 'option' : 'sys';
    const who = l.kind === 'say' ? l.who : l.kind === 'option' ? 'choice' : l.kind;
    h += `<div class="line ${cls} d${Math.min(2, l.depth)}"><span class="who">${esc(who)}</span><span>${esc(l.text)}${l.meta ? `<span class="meta">${esc(l.meta)}</span>` : ''}</span></div>`;
  }
  drawer.innerHTML = h; drawer.hidden = false;
  document.getElementById('close').addEventListener('click', () => { drawer.hidden = true; activeId = null; for (const q of cards.values()) q.el.classList.remove('active'); for (const e of edges) e.p.classList.remove('hot'); });
  const r = board.getBoundingClientRect(); const cx = (k.x + k.w / 2) * scale + tx, cy = (k.y + 60) * scale + ty;
  const vis = r.width - (drawer.offsetWidth || 0);
  if (cx < 0 || cx > vis || cy < 0 || cy > r.height) { tx += vis / 2 - cx; ty += r.height / 2 - cy; apply(); }
}

// ---- search: dim everything that does not match
const q = document.getElementById('q');
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  for (const k of cards.values()) {
    const hay = s && (k.card.id + ' ' + k.story.title + ' ' + k.card.trigger + ' ' + k.card.sets.join(' ') + ' ' + k.card.checks.join(' ') + ' ' + k.card.script.map((l) => (l.who ?? '') + ' ' + l.text).join(' ')).toLowerCase();
    k.el.classList.toggle('faded', !!s && !hay.includes(s));
  }
});
home();
if (location.hash.length > 1 && cards.has(location.hash.slice(1))) select(location.hash.slice(1));
</script>
